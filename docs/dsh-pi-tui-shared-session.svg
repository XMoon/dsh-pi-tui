<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Direct or Daemon: one Host and shared sessions</title>
<desc id="diagram-desc">On the left a Direct terminal runs its TUI and Host in one process. On the right two terminal clients, the official Web frontend, and a local ACP client connect to one local daemon Host, which coordinates a shared Agent Session.</desc>
<defs>
  <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101c33"/><stop offset="1" stop-color="#17283e"/></linearGradient>
  <linearGradient id="host" x1="0" y1="0" x2="1"><stop stop-color="#24465e"/><stop offset="1" stop-color="#215768"/></linearGradient>
  <marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#86cfbd"/></marker>
</defs>
<rect width="1120" height="480" rx="18" fill="url(#surface)"/>
<text x="35" y="46" fill="#f1f5fa" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">Run directly — or connect every client to one Host</text>
<text x="36" y="73" fill="#b0c4d6" font-family="Arial,Helvetica,sans-serif" font-size="14">DeepSeek Harness remains the Session and Agent authority</text>
<path d="M355 105V437" stroke="#4c6780" stroke-width="1.5" stroke-dasharray="5 7"/>
<text x="48" y="127" fill="#c5d7e7" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="1">DIRECT · DEFAULT</text>
<rect x="49" y="150" width="265" height="254" rx="17" fill="#18283d" stroke="#5b7a93" stroke-width="1.5"/>
<rect x="73" y="177" width="217" height="87" rx="13" fill="#293a54" stroke="#88a5ba" stroke-width="1.3"/>
<circle cx="93" cy="194" r="4" fill="#e5a88e"/><circle cx="105" cy="194" r="4" fill="#ecc775"/><circle cx="117" cy="194" r="4" fill="#81c4a6"/>
<text x="181" y="232" fill="#f7fbff" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="middle" font-weight="700">TUI</text>
<path d="M181 264V301" stroke="#86cfbd" stroke-width="2.5" marker-end="url(#tip)"/>
<rect x="85" y="309" width="192" height="65" rx="12" fill="#22505a" stroke="#86cfbd" stroke-width="1.7"/>
<text x="181" y="338" fill="#f2fffc" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" font-weight="700">Host</text>
<text x="181" y="358" fill="#c9ede5" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle">same process</text>
<text x="181" y="430" text-anchor="middle" fill="#a9bfd0" font-family="Arial,Helvetica,sans-serif" font-size="13">One terminal lifecycle</text>

<text x="388" y="127" fill="#c5d7e7" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="1">DAEMON · LINUX / macOS · OPT-IN</text>
<rect x="388" y="150" width="148" height="87" rx="12" fill="#263951" stroke="#7097b2" stroke-width="1.5"/>
<text x="462" y="184" fill="#f4faff" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="700">TUI</text><text x="462" y="211" fill="#bdd0dd" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle">Client A</text>
<rect x="549" y="150" width="148" height="87" rx="12" fill="#263951" stroke="#7097b2" stroke-width="1.5"/>
<text x="623" y="184" fill="#f4faff" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="700">TUI</text><text x="623" y="211" fill="#bdd0dd" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle">Client B</text>
<rect x="710" y="150" width="148" height="87" rx="12" fill="#263951" stroke="#7097b2" stroke-width="1.5"/>
<text x="784" y="184" fill="#f4faff" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="700">Web</text><text x="784" y="211" fill="#bdd0dd" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle">Official UI</text>
<rect x="871" y="150" width="199" height="87" rx="12" fill="#263951" stroke="#7097b2" stroke-width="1.5"/>
<text x="970" y="184" fill="#f4faff" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="700">ACP</text><text x="970" y="211" fill="#bdd0dd" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle">Local client · v1</text>
<path d="M462 237V258M623 237V258M784 237V258M970 237V258M462 258H970M716 258V282" stroke="#86cfbd" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#tip)"/>
<rect x="583" y="292" width="265" height="71" rx="13" fill="url(#host)" stroke="#86cfbd" stroke-width="2"/>
<text x="715" y="323" fill="#f1fffc" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="middle" font-weight="700">One local Host</text>
<text x="715" y="345" fill="#c8ede3" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle">Permission · concurrency · lifecycle</text>
<path d="M715 363V389" stroke="#86cfbd" stroke-width="2.4" marker-end="url(#tip)"/>
<rect x="583" y="400" width="265" height="49" rx="12" fill="#31445e" stroke="#96b5c8" stroke-width="1.7"/>
<text x="715" y="430" fill="#f5f8ff" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle" font-weight="700">Shared Agent Session</text>
<text x="388" y="470" fill="#91a9bc" font-family="Arial,Helvetica,sans-serif" font-size="11">Illustration · Shared Session ≠ unrestricted simultaneous writes · ACP limits apply</text>
</svg>
