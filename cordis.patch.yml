# The dsh-pi-tui bundle patch: the TUI surface over the dsh-base layer.
# Applied after dsh-base's insert; rows here override base rows by id, with
# the profile's own cordis.patch.yml and any --patch overlays still to come.
#
# The tui-startup plugin injects `cmdlineArgs` and provides `tuiStartup` as
# an ordinary Cordis service. The runner row injects that service, so Loader
# resolves its expressions only after the command line has been parsed.
# `dsh --profile pi-tui --help` provides nothing, so the TUI never mounts.

- insert:
    - id: tui-startup
      name: '@xmoon76/dsh-pi-tui/startup'

    # The extension platform (M3/E): the host provides the piTuiExtensions
    # service (third-party plugins inject it), the builtins row registers
    # the first-party chrome contributions through the SAME public API, and
    # the runner row attaches the surface host over the service's ledger.
    # All three gate on tuiStartup, so `--help` mounts none of them.
    - id: pi-tui-extension-host
      name: '@xmoon76/dsh-pi-tui/extensions'
      inject: [tuiStartup]

    - id: pi-tui-builtins
      name: '@xmoon76/dsh-pi-tui/builtins'
      inject: [tuiStartup, piTuiExtensions]

    - id: tui-app
      name: '@xmoon76/dsh-pi-tui'
      inject: [tuiStartup, piTuiExtensions, authorization]
      config:
        sessionId: ''

    # The authorization seam (`ctx.authorization`): plugin-owned credential-
    # obtaining flows, one attempt per key, transport-neutral notices and
    # prompts. The dsh host does NOT mount it anywhere (the base layer ships
    # only `credentials` + `llm-pi-ai`), so the TUI profile inserts the row
    # itself — the TUI is the interactive surface that can answer its
    # prompts. `AuthorizationService` injects `credentials`, so this row
    # activates only after the base's credentials row; llm-pi-ai's
    # provider login flows register once both services are up (it injects
    # `authorization` optionally and degrades without it).
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'

    # Consume DSH 0.1.2's official shipped presets directly. The upstream
    # service defaults includeShippedRoot/includeUserRoot to true, so this
    # bundle deliberately owns no duplicate standard/ptc/minimal/cordis root.
    # The legacy persisted id `code` is normalized at the data boundary to
    # `ptc`; it is not another preset row.
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard

    # Host-plane TypeScript runtime: the `ptc` preset's `tool-presentation`
    # row waits for `codeRuntime` and fails the preset at mount without it
    # (same host row the web bundle inserts).
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    # Host-plane cordis runner: the `cordis` preset's `tool-cordis` row waits
    # for `dynamicCordisRunner`/`cordisInspect` and fails the preset at mount
    # without them (same host row the web bundle inserts).
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

# ── the agent plane moves behind agent presets ─────────────────────────────
#
# Every row below composes what ONE agent contributes to the host registries:
# its tools, its prompt sections, its delegation backends. The base keeps them
# for single-session surfaces that compose their agent process-wide; the TUI
# now composes one preset per session, so these rows are disabled here and the
# `agent-presets` row above lets each session mount a preset instead.
#
# Disabling rather than deleting is deliberate: the base is shared, and a row
# absent from a surface overlay would silently reappear the day someone
# reorders the composition. The disabled set is the web bundle's, unchanged.
#
# Rows that STAY on the host plane (not listed): `tools` (registry), `shell-env`
# (publishes the DSH env the model's shell sees), `subagent` + its spawn/fork
# backends (process singletons), `tool-subagent-report` (host singleton), the
# goal/jobs/compaction services and their commands, `permission`, `approval`,
# `sandbox*`, `fs-observation-policy`, `spill*`, `timeout-policy`,
# `repeat-tool-reminder`, `session-*`, `token-meter`.

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true
