name: Release

# Publish @xmoon76/dsh-pi-tui to npm when a `v*` tag is pushed.
# The vendored fork (@xmoon76/pi-tui) is private and bundled into the
# release package's dist at build time, so `pnpm -r publish` publishes
# exactly one package (pnpm skips private ones).
# Uses npm's OIDC provenance integration: with `id-token: write` npm
# attaches a signed build provenance (source = this repo).

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # npm provenance (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm -r publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
