name: Release

# Publish both packages to npm when a `v*` tag is pushed.
# Uses npm's OIDC provenance integration: no NPM_TOKEN secret required.
# `publishConfig.provenance: true` in packages/pi-tui/package.json makes
# npm attach a signed build provenance (source = this repo).

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # npm provenance (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # Topological order: @xmoon76/pi-tui first, then @xmoon76/tui-app.
      - run: pnpm -r publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
