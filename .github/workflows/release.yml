name: Release

# Publish @xmoon76/dsh-pi-tui to npm when a `v*` tag is pushed.
# The vendored fork (@xmoon76/pi-tui) is private and bundled into the
# release package's dist at build time; the pack gate (prepack: clean,
# build fork + bundle, typecheck, test; postpack: tarball smoke test)
# produces the EXACT tarball this workflow publishes — the release job
# never regenerates a different artifact. Tag pushes also run the full CI
# (ci.yml triggers on `tags: ['v*']`), so the published commit is the
# CI-verified one.
# Uses npm's OIDC provenance integration: with `id-token: write` npm
# attaches a signed build provenance (source = this repo).

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # npm provenance (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One command: prepack gate + pack + postpack smoke on the exact bytes.
      - run: pnpm pack:release
      - name: Publish the verified tarball
        run: npm publish ./packages/dsh-pi-tui/@xmoon76-dsh-pi-tui-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
