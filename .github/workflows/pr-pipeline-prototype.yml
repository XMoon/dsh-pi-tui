name: PR pipeline prototype

# A PROTOTYPE of the PR-only validated packing path. It is NOT a required
# check and it changes NOTHING about the release contract.
#
# The problem it addresses is measured: `pnpm pack` runs the package's
# `prepack`, which runs the WHOLE product lane on ONE runner inside ONE job.
# On a 4 vCPU runner that lane is ~320 s of a ~400 s job, and the job is
# ~400 s of a ~508 s workflow. The lane is the critical path, and a single
# runner cannot shorten it by being given a better concurrency (measured:
# the default IS the best level on 4 vCPUs).
#
# The shape below takes the lane OFF the critical path instead:
#
#   build once (fork + bundle) ──┬─ typecheck:bundle            (sibling, ONCE)
#        │                       ├─ product shard 1/N ─┐
#        │                       ├─ ...                ├─ aggregate (proof)
#        │                       └─ product shard N/N ─┘
#        └─ pack WITHOUT lifecycle ─────────────────────────────┐
#                                                               ↓
#                              qualify: 8 smokes + source leak + startup
#                                                               ↓
#                                        qualified candidate upload
#
# What it does NOT do:
#
#   - it does not touch `.github/workflows/ci.yml`, so the ordinary PR
#     checks and the release pipeline are unchanged;
#   - it does not bypass the release lifecycle: a tag still runs the
#     ordinary `pnpm pack`, which still runs `prepack` and `postpack`;
#   - it does not trust a PR artifact as a release candidate. The upload is
#     named `prototype-qualified-candidate` and no publishing event reads it.
#
# Everything is bound to ONE commit, one dependency mode and ONE build
# identity: the shards and the pack both prove they consume the build the
# build job produced, and the qualification proves it ran against the exact
# tarball the pack job produced.

on:
  # The prototype branch ONLY. It must not be triggerable by the measurement
  # branches: those exist to measure the lane, and running this pipeline
  # beside them would add runner load to the very measurement it would
  # distort.
  push:
    branches:
      - 'ci/pr-pipeline-prototype-*'
  workflow_dispatch:
    inputs:
      shard_total:
        description: 'How many shards to split the product lane into'
        required: false
        default: '4'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the dependency mode the same way the real CI does, so the
  # prototype exercises the real resolver rather than a copy of its rules.
  # ---------------------------------------------------------------------------
  context:
    name: Resolve the pipeline context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.context.outputs.mode }}
      source_ref: ${{ steps.context.outputs.source_ref }}
      source_expected_version: ${{ steps.context.outputs.source_expected_version }}
      fault: ${{ steps.fault.outputs.fault }}
      shard_total: ${{ steps.shards.outputs.shard_total }}
      shards: ${{ steps.shards.outputs.shards }}
      started_epoch: ${{ steps.shards.outputs.started_epoch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Resolve the DSH mode
        id: context
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        # The mode comes from the repository's OWN resolver, with no override.
        #
        # Source Mode IS wired here — pinned distribution, one dependency
        # preparation, the leak gate taking the distribution, the equivalence
        # proof running its own two packs, the downstream fresh-install probe —
        # and it was QUALIFIED end to end on this branch through an
        # Owner-approved test entry (runs 39701407942 and 39702749092: pinned
        # 687f282e built into 343 tarballs, 4 shards, 9122 cases / 37 skips /
        # 0 failures, 8/8 smokes, Source leak gate, Node 22/24/26 fresh
        # installs, qualified artifact 858c1199...).
        #
        # That ENTRY is withdrawn. A committed switch that can turn a branch
        # into a Source Mode run is not something to leave lying around, and
        # the resolver decides again: a source run needs `next`'s tracked
        # policy, exactly as before.
        run: node scripts/dsh-ci-context.mjs

      # A source run cannot be RESOLVED here, so the mode is refused at the
      # entry, before a build or a candidate can exist. That is not a claim
      # that Source Mode is broken — it was qualified, above — but that this
      # workflow has no way to PIN it on these branches, and a mode this
      # pipeline cannot pin must not be qualified.
      - name: Refuse a dependency mode this prototype cannot qualify
        env:
          DSH_MODE: ${{ steps.context.outputs.mode }}
        run: node scripts/pipeline-guard.mjs mode "$DSH_MODE"

      # The FAULT this run is asked to perform on itself.
      #
      # The token is a COMMITTED fact, so a run cannot quietly differ from
      # the one its commit describes, and the list is closed: a typo is a
      # configuration error rather than a silent no-op that would produce a
      # green run proving nothing.
      - name: Resolve the fault injection
        id: fault
        run: |
          set -euo pipefail
          node scripts/pipeline-guard.mjs fault scripts/prototype-fault.txt
          echo "fault=$(tr -d '[:space:]' < scripts/prototype-fault.txt)" >> "$GITHUB_OUTPUT"

      - name: Resolve the shard list
        id: shards
        env:
          DSH_DISPATCHED_SHARD_TOTAL: ${{ inputs.shard_total || '' }}
        run: |
          set -euo pipefail
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          # The shard total is a COMMITTED fact, with the dispatch input as an
          # override when one exists.
          #
          # It must be readable from the tree because a workflow that is not
          # on the default branch cannot be dispatched at all: a push run has
          # no inputs, so an input-only parameter would leave every push
          # silently pinned to one shape and make the other shapes untestable.
          DSH_SHARD_TOTAL="$(node scripts/pipeline-guard.mjs shard-total --input "$DSH_DISPATCHED_SHARD_TOTAL")"
          case "$DSH_SHARD_TOTAL" in
            1) shards='[1]' ;;
            2) shards='[1,2]' ;;
            3) shards='[1,2,3]' ;;
            4) shards='[1,2,3,4]' ;;
            *) echo "unsupported shard total: $DSH_SHARD_TOTAL" >&2; exit 1 ;;
          esac
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "shard_total=$DSH_SHARD_TOTAL" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # THE ONE BUILD. It runs `clean` and `build` (fork first, then the bundle)
  # and then takes a DIGEST of the outputs. Every consumer proves it holds
  # that build:
  #
  #   - the shards verify the digest before running, so a partially restored
  #     tree fails instead of testing an unverified build;
  #   - the pack job verifies it before packing, so the tarball is packed
  #     from the build the tests ran against.
  # ---------------------------------------------------------------------------
  build:
    name: Build the shared artifact
    needs:
      - context
      # In Source Mode the build consumes the pinned distribution, so it
      # cannot start before that pack exists.
      - source-pack
    # `source-pack` is SKIPPED in npm mode, and a skipped dependency would
    # otherwise skip this job too. The condition therefore says "run unless
    # the pack failed": a source run whose distribution could not be built
    # must not fall through to the registry.
    if: ${{ !cancelled() && needs['context'].result == 'success' && needs['source-pack'].result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      # One dependency preparation for every job, because the two modes need
      # DIFFERENT graphs: a job that installed from the registry while the run
      # claimed Source Mode would be testing something else.
      - name: Download the pinned DSH source pack
        if: ${{ needs.context.outputs.mode == 'source' }}
        uses: actions/download-artifact@v8
        with:
          name: prototype-dsh-source-pack
          path: ${{ runner.temp }}/dsh-source-pack

      - name: Prepare the dependencies for this mode
        env:
          DSH_MODE_RESOLVED: ${{ needs.context.outputs.mode }}
        run: |
          set -euo pipefail
          node scripts/prototype-deps.mjs \
            --mode "$DSH_MODE_RESOLVED" \
            --distribution "$RUNNER_TEMP/dsh-source-pack" \
            --workspace "$GITHUB_WORKSPACE"

      # `clean` FIRST, exactly like `prepack` does: a build that reuses a
      # stale `dist` is not the build this commit produces.
      - name: Clean and build
        run: pnpm clean && pnpm clean:fork && pnpm build

      - name: Record the build identity
        run: node scripts/build-digest.mjs --write build-digest.json

      - name: Upload the shared build
        # INJECTION 'build-missing' suppresses the UPLOAD, so this job still
        # succeeds and the artifact never exists.
        #
        # That is the harder of the two shapes on purpose: the producer looks
        # healthy while the artifact is missing. What the injection proves is
        # that every CONSUMER fails closed instead of rebuilding its own
        # build — not that the producer phase fails, because it does not.
        #
        # The targeted phase for this token is therefore the shard consumer,
        # and the verifier asserts the consumer's own "Artifact not found"
        # error rather than a producer failure.
        if: ${{ needs.context.outputs.fault != 'build-missing' }}
        uses: actions/upload-artifact@v7
        with:
          name: prototype-build
          # The build OUTPUTS only. `node_modules` is reinstalled in every
          # consumer (it is not portable), and `src` comes from the checkout.
          path: |
            dist
            packages/pi-tui/dist
            generated
            build-digest.json
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  # THE PINNED DSH DISTRIBUTION, in Source Mode only.
  #
  # Source Mode does not install the registry's DSH: it installs the official
  # family built from the pinned commit, so every job that installs
  # dependencies needs the SAME pack. Building it once and shipping it as an
  # artifact is what makes "the same dependency graph everywhere" true rather
  # than intended.
  # ---------------------------------------------------------------------------
  source-pack:
    name: Build the pinned DSH source pack
    needs: context
    if: ${{ needs.context.outputs.mode == 'source' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout the pinned DeepSeek Harness
        uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.context.outputs.source_ref }}
          path: deepseek-harness
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Build and pack the official DSH family
        env:
          DSH_SOURCE_REF: ${{ needs.context.outputs.source_ref }}
          DSH_EXPECTED_VERSION: ${{ needs.context.outputs.source_expected_version }}
        run: |
          set -euo pipefail
          node scripts/dsh-source-pack.mjs \
            --dsh-dir "$GITHUB_WORKSPACE/deepseek-harness" \
            --ref "$DSH_SOURCE_REF" \
            --expected-version "$DSH_EXPECTED_VERSION" \
            --out "$RUNNER_TEMP/dsh-source-pack"
          test -f "$RUNNER_TEMP/dsh-source-pack/dsh-source-distribution.json"

      - name: Upload the pinned DSH source pack
        uses: actions/upload-artifact@v7
        with:
          name: prototype-dsh-source-pack
          path: ${{ runner.temp }}/dsh-source-pack
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  # TYPECHECK, ONCE.
  #
  # It DEPENDS on the build: `tsconfig.json` includes `src` and `test`, and
  # those import `@xmoon76/pi-tui`, whose declarations live in the vendored
  # fork's BUILD output. Running it before the build fails with
  # "Cannot find module '@xmoon76/pi-tui' or its corresponding type
  # declarations" — measured on the first run of this prototype, not guessed.
  #
  # So it downloads the same verified build and runs ONCE, in parallel with
  # the shards. It is not repeated on four runners: the same full typecheck
  # four times would add runner-minutes and prove nothing new.
  # ---------------------------------------------------------------------------
  typecheck:
    name: Bundle typecheck
    needs:
      - source-pack
      - context
      - build
    # `source-pack` is SKIPPED in npm mode, and a skipped dependency would
    # otherwise skip this job too. The condition therefore says "run unless
    # the pack failed": a source run whose distribution could not be built
    # must not fall through to the registry.
    if: ${{ !cancelled() && needs['source-pack'].result != 'failure' && needs['context'].result == 'success' && needs['build'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      # One dependency preparation for every job, because the two modes need
      # DIFFERENT graphs: a job that installed from the registry while the run
      # claimed Source Mode would be testing something else.
      - name: Download the pinned DSH source pack
        if: ${{ needs.context.outputs.mode == 'source' }}
        uses: actions/download-artifact@v8
        with:
          name: prototype-dsh-source-pack
          path: ${{ runner.temp }}/dsh-source-pack

      - name: Prepare the dependencies for this mode
        env:
          DSH_MODE_RESOLVED: ${{ needs.context.outputs.mode }}
        run: |
          set -euo pipefail
          node scripts/prototype-deps.mjs \
            --mode "$DSH_MODE_RESOLVED" \
            --distribution "$RUNNER_TEMP/dsh-source-pack" \
            --workspace "$GITHUB_WORKSPACE"

      - name: Download the shared build
        uses: actions/download-artifact@v8
        with:
          name: prototype-build
          path: ${{ github.workspace }}

      - name: Verify this typecheck holds the build the build job produced
        run: node scripts/build-digest.mjs --verify build-digest.json

      - name: Typecheck the bundle
        run: pnpm typecheck:bundle

  # ---------------------------------------------------------------------------
  # THE PRODUCT SHARDS: Node's own `--test-shard`, so the partition is
  # disjoint by construction and the aggregate only has to PROVE it.
  # ---------------------------------------------------------------------------
  product-shard:
    name: Product shard ${{ matrix.shard }}/${{ needs.context.outputs.shard_total }}
    needs:
      - source-pack
      - context
      - build
    # `source-pack` is SKIPPED in npm mode, and a skipped dependency would
    # otherwise skip this job too. The condition therefore says "run unless
    # the pack failed": a source run whose distribution could not be built
    # must not fall through to the registry.
    if: ${{ !cancelled() && needs['source-pack'].result != 'failure' && needs['context'].result == 'success' && needs['build'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.context.outputs.shards) }}
    env:
      DSH_TEST_JSONL: ${{ github.workspace }}/diagnostics/cases.jsonl
      DSH_TEST_EFFECTIVE_JSON: ${{ github.workspace }}/diagnostics/effective-params.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      # One dependency preparation for every job, because the two modes need
      # DIFFERENT graphs: a job that installed from the registry while the run
      # claimed Source Mode would be testing something else.
      - name: Download the pinned DSH source pack
        if: ${{ needs.context.outputs.mode == 'source' }}
        uses: actions/download-artifact@v8
        with:
          name: prototype-dsh-source-pack
          path: ${{ runner.temp }}/dsh-source-pack

      - name: Prepare the dependencies for this mode
        env:
          DSH_MODE_RESOLVED: ${{ needs.context.outputs.mode }}
        run: |
          set -euo pipefail
          node scripts/prototype-deps.mjs \
            --mode "$DSH_MODE_RESOLVED" \
            --distribution "$RUNNER_TEMP/dsh-source-pack" \
            --workspace "$GITHUB_WORKSPACE"

      # The build is DOWNLOADED, not rebuilt. The digest comes with it, and
      # the next step proves the downloaded tree is that build.
      - name: Download the shared build
        uses: actions/download-artifact@v8
        with:
          name: prototype-build
          path: ${{ github.workspace }}

      # INJECTION 'digest-mismatch': one byte of a build output changes, so
      # this shard's build is no longer the one the build job identified.
      # The verification below must reject it BEFORE the lane runs.
      # The target is shard 1, which exists for EVERY shard total. A target
      # of "shard 2" would silently never fire for a 1-shard run, and the
      # pipeline would then succeed while claiming to have injected a fault.
      - name: "INJECTED FAULT: corrupt the downloaded build"
        if: ${{ needs.context.outputs.fault == 'digest-mismatch' && matrix.shard == 1 }}
        run: |
          set -euo pipefail
          printf '\n/* injected */\n' >> dist/index.mjs
          echo "corrupted dist/index.mjs on shard ${{ matrix.shard }}"

      - name: Verify this shard holds the build the build job produced
        run: node scripts/build-digest.mjs --verify build-digest.json

      # INJECTION 'shard-fail': this shard's run fails. What is under test is
      # the pipeline's HANDLING of a failed shard — the matrix must report
      # failure and the aggregate must refuse the set.
      # Shard 1 again: it exists for every total.
      - name: "INJECTED FAULT: fail this shard"
        if: ${{ needs.context.outputs.fault == 'shard-fail' && matrix.shard == 1 }}
        run: |
          echo "the shard test run failed (INJECTED FAULT 'shard-fail')" >&2
          exit 1

      - name: Run this shard
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          start=$(date +%s)
          node scripts/run-test-lane.mjs product --shard=${{ matrix.shard }}/${{ needs.context.outputs.shard_total }}
          end=$(date +%s)
          node scripts/runner-spec.mjs \
            --wall-clock-seconds "$((end - start))" \
            --out diagnostics/runner-spec.json

      - name: Upload this shard's records
        # INJECTION 'shard-missing': these records never arrive.
        #
        # The shard itself RAN and passed, so this job still succeeds; what
        # must fail is the AGGREGATE, which sees three shards where four are
        # required. The verifier therefore targets 'aggregate' for this
        # token, not 'product shards'.
        # Drop the LAST shard of the CURRENT total, so the aggregate is
        # always short one shard. A fixed index would leave an N=1 run with
        # nothing dropped.
        if: ${{ always() && !(needs.context.outputs.fault == 'shard-missing' && matrix.shard == fromJSON(needs.context.outputs.shard_total)) }}
        uses: actions/upload-artifact@v7
        with:
          name: prototype-shard-${{ matrix.shard }}-node24
          path: diagnostics
          if-no-files-found: warn
          retention-days: 3

  # ---------------------------------------------------------------------------
  # THE AGGREGATE: the proof that the shards are the whole lane, and that
  # each one ran the shard it claims.
  #
  # `if: always()` so a FAILED or CANCELLED shard still produces a report —
  # the report then says why the set is invalid, instead of the aggregate
  # being skipped and the downstream jobs silently having no proof.
  # ---------------------------------------------------------------------------
  aggregate:
    name: Aggregate the shards
    needs:
      - context
      - product-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download every shard's records
        uses: actions/download-artifact@v8
        with:
          pattern: prototype-shard-*
          path: shards

      - name: Require every shard job to have SUCCEEDED
        env:
          SHARD_RESULT: ${{ needs.product-shard.result }}
        run: |
          set -euo pipefail
          # A green aggregate must never hide a failed shard. The matrix
          # result is the authority for "the job ran and passed"; the record
          # checks below are the authority for "it covered its files".
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "the product shard matrix result is '$SHARD_RESULT', not 'success'" >&2
            exit 1
          fi

      - name: Prove the shards are the whole lane
        env:
          DSH_EXPECTED_RUN_ID: ${{ github.run_id }}
          DSH_EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          # No concurrency is asserted here: this pipeline does not pass the
          # flag, so the runner must record Node's default (null). Asserting
          # "default" catches a pipeline that silently starts applying a
          # level nobody chose.
          DSH_EXPECTED_CONCURRENCY: default
          DSH_MODE: ${{ needs.context.outputs.mode }}
          # WHERE the npm baseline numbers came from, as a run a reader can
          # open.
          #
          # A count on its own cannot say which run produced it, and this
          # pipeline is not allowed to certify itself against itself: the
          # baseline is the UNSHARDED lane's own result, measured on a
          # different run from this one.
          #
          # A legitimate change to the number of tests must update these
          # files IN THE SAME COMMIT as the test change, citing the full
          # UNSHARDED run that produced the new numbers.
          DSH_BASELINE_SOURCE_NPM: >-
            run https://github.com/XMoon/dsh-pi-tui/actions/runs/39626830482
            (branch ci/test-clarity-diagnostics-20261021 at e4ee68170b69c1d5e7cd5f1940c89a92a5b4f77a,
            3 attempts, all green), UNSHARDED product lane (shard total 1,
            Node default concurrency), npm mode, Linux, Node 24: 9122 cases,
            37 skipped = 36 optional-bundle + 1 no fd/fdfind. The product code
            and the product test tree at that SHA are byte-identical to main
            d978f93a; the branch adds only the measurement tooling and its
            committed configuration.
        run: |
          set -euo pipefail
          # The case and skip baselines are committed facts, read from files
          # so that a qualification CANNOT disable the comparison by passing
          # an empty value. A missing, empty or malformed file FAILS.
          #
          # They are two SEPARATE checks: the count catches a case that
          # stopped running, and the reasons below catch a case that
          # stopped running for a reason nobody agreed to.
          #
          # They are also MODE-SCOPED. The npm baseline is not a Source Mode
          # baseline: a different dependency graph can legitimately change
          # which cases discover, which fail to provision a package, and which
          # environment capability is missing — and a skip count carried over
          # from the other mode would call that change either a loss or a
          # proof. Source Mode therefore has its OWN files, and an unrecorded
          # Source baseline FAILS rather than borrowing the npm numbers.
          if [ "$DSH_MODE" = 'source' ]; then
            export DSH_EXPECTED_CASES_FILE=scripts/measurement-source-expected-cases.txt
            export DSH_EXPECTED_SKIPPED_FILE=scripts/measurement-source-expected-skipped.txt
            export DSH_ACCEPTED_SKIPS_FILE=scripts/measurement-source-accepted-skips.txt
            if [ ! -f scripts/measurement-source-baseline.txt ]; then
              echo 'no Source Mode baseline is recorded (scripts/measurement-source-baseline.txt)' >&2
              echo 'run the UNSHARDED Source Mode lane once, then commit its case and skip totals together with the run that produced them' >&2
              exit 1
            fi
            BASELINE_SOURCE="$(cat scripts/measurement-source-baseline.txt)"
          else
            export DSH_EXPECTED_CASES_FILE=scripts/measurement-expected-cases.txt
            export DSH_EXPECTED_SKIPPED_FILE=scripts/measurement-expected-skipped.txt
            export DSH_ACCEPTED_SKIPS_FILE=scripts/measurement-accepted-skips.txt
            BASELINE_SOURCE="$DSH_BASELINE_SOURCE_NPM"
          fi
          DSH_EXPECTED_SHA="$(git rev-parse HEAD)"
          export DSH_EXPECTED_SHA
          node scripts/verify-shards.mjs \
            --shards shards \
            --total "${{ needs.context.outputs.shard_total }}" \
            --baseline-source "$BASELINE_SOURCE" \
            --out aggregate.json

      - name: Upload the aggregate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prototype-aggregate
          path: aggregate.json
          if-no-files-found: warn
          retention-days: 3

  # ---------------------------------------------------------------------------
  # THE CANDIDATE: the package built from the SAME verified build, WITHOUT
  # the package lifecycle.
  #
  # `--config.ignore-scripts=true` skips BOTH hooks: `prepack` (which would
  # run the whole product lane again) AND `postpack` (which would run the
  # eight smokes). That is measured, not assumed. So this job earns the
  # tarball and records its digest; the QUALIFY job earns the qualification.
  # ---------------------------------------------------------------------------
  candidate:
    name: Build the candidate tarball
    needs:
      - source-pack
      - context
      - build
    # `source-pack` is SKIPPED in npm mode, and a skipped dependency would
    # otherwise skip this job too. The condition therefore says "run unless
    # the pack failed": a source run whose distribution could not be built
    # must not fall through to the registry.
    if: ${{ !cancelled() && needs['source-pack'].result != 'failure' && needs['context'].result == 'success' && needs['build'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      # One dependency preparation for every job, because the two modes need
      # DIFFERENT graphs: a job that installed from the registry while the run
      # claimed Source Mode would be testing something else.
      - name: Download the pinned DSH source pack
        if: ${{ needs.context.outputs.mode == 'source' }}
        uses: actions/download-artifact@v8
        with:
          name: prototype-dsh-source-pack
          path: ${{ runner.temp }}/dsh-source-pack

      - name: Prepare the dependencies for this mode
        env:
          DSH_MODE_RESOLVED: ${{ needs.context.outputs.mode }}
        run: |
          set -euo pipefail
          node scripts/prototype-deps.mjs \
            --mode "$DSH_MODE_RESOLVED" \
            --distribution "$RUNNER_TEMP/dsh-source-pack" \
            --workspace "$GITHUB_WORKSPACE"

      - name: Download the shared build
        uses: actions/download-artifact@v8
        with:
          name: prototype-build
          path: ${{ github.workspace }}

      - name: Verify the pack consumes the build the tests ran against
        run: node scripts/build-digest.mjs --verify build-digest.json

      - name: Pack WITHOUT the lifecycle
        id: pack
        run: |
          set -euo pipefail
          rm -f xmoon76-dsh-pi-tui-*.tgz
          pnpm pack --config.ignore-scripts=true --pack-destination "$GITHUB_WORKSPACE"

          mapfile -t TARBALLS < <(find . -maxdepth 1 -type f -name 'xmoon76-dsh-pi-tui-*.tgz' -printf '%f\n' | sort)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            printf '%s\n' "${TARBALLS[@]}" >&2
            exit 1
          fi
          TARBALL="${TARBALLS[0]}"
          SHA256="$(sha256sum "$TARBALL" | cut -d' ' -f1)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "candidate $TARBALL $SHA256"

      - name: Upload the candidate
        uses: actions/upload-artifact@v7
        with:
          name: prototype-candidate
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  # THE QUALIFICATION: every gate that makes the tarball a candidate, run
  # against the SAME tarball, after the tests and the typecheck have passed.
  #
  # The digest is re-computed HERE, from the downloaded bytes. The action's
  # own digest check reports a mismatch as a WARNING, which is not a gate,
  # so the comparison is an explicit step.
  # ---------------------------------------------------------------------------
  qualify:
    name: Qualify the candidate
    needs:
      - source-pack
      - context
      - build
      - typecheck
      - aggregate
      - candidate
    # `source-pack` is SKIPPED in npm mode, and a skipped dependency would
    # otherwise skip this job too. The condition therefore says "run unless
    # the pack failed": a source run whose distribution could not be built
    # must not fall through to the registry.
    if: ${{ !cancelled() && needs['source-pack'].result != 'failure' && needs['context'].result == 'success' && needs['build'].result == 'success' && needs['typecheck'].result == 'success' && needs['aggregate'].result == 'success' && needs['candidate'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_MODE: ${{ needs.context.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      # One dependency preparation for every job, because the two modes need
      # DIFFERENT graphs: a job that installed from the registry while the run
      # claimed Source Mode would be testing something else.
      - name: Download the pinned DSH source pack
        if: ${{ needs.context.outputs.mode == 'source' }}
        uses: actions/download-artifact@v8
        with:
          name: prototype-dsh-source-pack
          path: ${{ runner.temp }}/dsh-source-pack

      - name: Prepare the dependencies for this mode
        env:
          DSH_MODE_RESOLVED: ${{ needs.context.outputs.mode }}
        run: |
          set -euo pipefail
          node scripts/prototype-deps.mjs \
            --mode "$DSH_MODE_RESOLVED" \
            --distribution "$RUNNER_TEMP/dsh-source-pack" \
            --workspace "$GITHUB_WORKSPACE"

      - name: Download the candidate
        uses: actions/download-artifact@v8
        with:
          name: prototype-candidate
          path: candidate

      - name: Prove the candidate is the tarball the pack job produced
        env:
          EXPECTED_SHA256: ${{ needs.candidate.outputs.sha256 }}
          EXPECTED_TARBALL: ${{ needs.candidate.outputs.tarball }}
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(find candidate -maxdepth 1 -type f -name 'xmoon76-dsh-pi-tui-*.tgz' -print | sort)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one downloaded tarball, found ${#TARBALLS[@]}" >&2
            exit 1
          fi
          ACTUAL="$(sha256sum "${TARBALLS[0]}" | cut -d' ' -f1)"
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "the downloaded tarball is $ACTUAL, not the produced $EXPECTED_SHA256" >&2
            exit 1
          fi
          if [ "$(basename "${TARBALLS[0]}")" != "$EXPECTED_TARBALL" ]; then
            echo "the downloaded tarball is $(basename "${TARBALLS[0]}"), not $EXPECTED_TARBALL" >&2
            exit 1
          fi
          echo "CANDIDATE=${TARBALLS[0]}" >> "$GITHUB_ENV"
          echo "the candidate is the produced tarball ($ACTUAL)"

      # INJECTION 'smoke-fail': the candidate is truncated AFTER the digest
      # check above, so the FIRST smoke (which extracts the tarball) meets a
      # real broken archive. The failure is the smoke's, not a synthetic
      # exit code.
      - name: "INJECTED FAULT: truncate the candidate before the smokes"
        if: ${{ needs.context.outputs.fault == 'smoke-fail' }}
        run: |
          set -euo pipefail
          size=$(stat -c%s "$CANDIDATE")
          truncate -s $((size / 2)) "$CANDIDATE"
          echo "truncated $CANDIDATE to $((size / 2)) bytes"

      # The eight postpack smokes, one step each, in the SAME order the
      # package lifecycle runs them, each given the explicit path of the one
      # candidate. A failing smoke stops the job, exactly like `&&` in the
      # lifecycle. Any of them missing is a MISSING qualification.
      - name: "Smoke 1/8: tarball"
        run: node scripts/tarball-smoke.mjs "$CANDIDATE"
      - name: "Smoke 2/8: extension fixture"
        run: node scripts/extension-fixture-smoke.mjs "$CANDIDATE"
      - name: "Smoke 3/8: advanced plugin"
        run: node scripts/advanced-plugin-smoke.mjs "$CANDIDATE"
      - name: "Smoke 4/8: phase4 plugin"
        run: node scripts/phase4-plugin-smoke.mjs "$CANDIDATE"
      - name: "Smoke 5/8: unstable plugin"
        run: node scripts/unstable-plugin-smoke.mjs "$CANDIDATE"
      - name: "Smoke 6/8: vim plugin"
        run: node scripts/vim-plugin-smoke.mjs "$CANDIDATE"
      - name: "Smoke 7/8: examples plugin"
        run: node scripts/examples-plugin-smoke.mjs "$CANDIDATE"
      - name: "Smoke 8/8: compose agent"
        run: node scripts/compose-agent-compat-smoke.mjs "$CANDIDATE"

      - name: Source leak gate
        env:
          DSH_SOURCE_ARTIFACT: ${{ runner.temp }}/dsh-source-pack
        run: |
          set -euo pipefail
          # In Source Mode the gate must know which distribution the build
          # consumed, or it cannot tell a legitimate source resolution from
          # a leak. Passing nothing would run a weaker check on the same
          # tarball and report the same green.
          if [ "$DSH_MODE" = "source" ]; then
            node scripts/dsh-source-leak-gate.mjs "$CANDIDATE" --distribution "$DSH_SOURCE_ARTIFACT"
          else
            node scripts/dsh-source-leak-gate.mjs "$CANDIDATE"
          fi

      - name: TUI startup strictness handshake
        if: env.DSH_MODE == 'npm'
        run: pnpm smoke:startup-strictness -- "$CANDIDATE"

      # A step that does not apply must SAY so. A silent skip in a
      # qualification is indistinguishable from a gate that ran and passed.
      - name: Record the npm-only smoke on a source run
        if: env.DSH_MODE == 'source'
        run: |
          echo 'NOT_APPLICABLE: the startup strictness smoke is npm-only; Source Mode is qualified by its own lanes'

      # The digest is checked AGAIN, after the smokes, against the value the
      # pack job recorded: a candidate replaced between the smokes and the
      # upload must not be uploaded as the one that was qualified.
      - name: Re-prove the candidate was not replaced during qualification
        env:
          EXPECTED_SHA256: ${{ needs.candidate.outputs.sha256 }}
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum "$CANDIDATE" | cut -d' ' -f1)"
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "the candidate changed during qualification: $ACTUAL, not $EXPECTED_SHA256" >&2
            exit 1
          fi

      # This upload is a PROVISIONAL candidate, not a qualified one.
      #
      # The downstream compatibility legs have not run yet, and the real CI
      # still has to test the package on the supported Node versions. An
      # artifact that downstream jobs may CONSUME is not the same thing as
      # an artifact that has PASSED those jobs: the qualified artifact is
      # produced by the `qualified` job below, and only after every
      # downstream leg succeeded.
      - name: Upload the PROVISIONAL candidate for downstream consumption
        uses: actions/upload-artifact@v7
        with:
          name: prototype-provisional-candidate
          path: ${{ env.CANDIDATE }}
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  # THE DOWNSTREAM COMPATIBILITY MATRIX.
  #
  # This is a REAL consumer gate, not a placeholder: each leg installs the
  # workspace, downloads the provisional candidate and runs the tarball
  # smoke against it on one of the supported Node versions. A packaging
  # change that breaks a supported runtime fails here.
  #
  # It exists so the sixth failure class can be proved: a downstream leg
  # that fails must prevent the QUALIFIED artifact from existing.
  # ---------------------------------------------------------------------------
  downstream:
    name: Downstream compat / Node ${{ matrix.node }}
    needs:
      - source-pack
      - context
      - qualify
    # `source-pack` is SKIPPED in npm mode, and a skipped dependency would
    # otherwise skip this job too. The condition therefore says "run unless
    # the pack failed": a source run whose distribution could not be built
    # must not fall through to the registry.
    if: ${{ !cancelled() && needs['source-pack'].result != 'failure' && needs['context'].result == 'success' && needs['qualify'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The same boundaries the release matrix covers: the minimum Node 22,
        # the minimum Node 24, and the current major.
        node:
          - '22.19.0'
          - '24.0.0'
          - '26'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false

      # One dependency preparation for every job, because the two modes need
      # DIFFERENT graphs: a job that installed from the registry while the run
      # claimed Source Mode would be testing something else.
      - name: Download the pinned DSH source pack
        if: ${{ needs.context.outputs.mode == 'source' }}
        uses: actions/download-artifact@v8
        with:
          name: prototype-dsh-source-pack
          path: ${{ runner.temp }}/dsh-source-pack

      # TWO modes, two probes, and they must not collapse into one.
      #
      # npm mode keeps the workspace install this matrix has always done.
      #
      # Source mode does NOT install this checkout at all: the fresh-install
      # probe is deliberately independent of the workspace's node_modules,
      # lockfile and pnpm metadata — exactly as the release pipeline's
      # `compat-smoke` job is. Installing here would also export
      # `TARBALL_SMOKE_SKIP_INSTALL=1`, and the tarball smoke would then skip
      # the install it is here to prove: the Source distribution's fresh
      # install would never be attempted, and the leg would pass on structure
      # alone.
      - name: Prepare the dependencies for this mode
        if: ${{ needs.context.outputs.mode == 'npm' }}
        env:
          DSH_MODE_RESOLVED: ${{ needs.context.outputs.mode }}
        run: |
          set -euo pipefail
          node scripts/prototype-deps.mjs \
            --mode "$DSH_MODE_RESOLVED" \
            --distribution "$RUNNER_TEMP/dsh-source-pack" \
            --workspace "$GITHUB_WORKSPACE"

      - name: Download the provisional candidate
        uses: actions/download-artifact@v8
        with:
          name: prototype-provisional-candidate
          path: provisional

      # INJECTION 'downstream-fail': ONE leg of the real matrix fails. What
      # is under test is that the qualified artifact never comes into
      # existence afterwards.
      - name: "INJECTED FAULT: fail this downstream leg"
        if: ${{ needs.context.outputs.fault == 'downstream-fail' && matrix.node == '26' }}
        run: |
          echo "the downstream compatibility leg failed (INJECTED FAULT 'downstream-fail')" >&2
          exit 1

      - name: Run the tarball smoke on this Node version
        env:
          DSH_MODE: ${{ needs.context.outputs.mode }}
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(find provisional -maxdepth 1 -type f -name 'xmoon76-dsh-pi-tui-*.tgz' -print | sort)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one provisional tarball, found ${#TARBALLS[@]}" >&2
            exit 1
          fi
          # A Source Mode leg must PROVE the fresh install of the pinned
          # distribution, not the registry graph: the distribution is the
          # dependency graph the run claims, and the smoke's install step is
          # the only place this matrix ever touches it.
          if [ "$DSH_MODE" = 'source' ]; then
            node scripts/tarball-smoke.mjs "${TARBALLS[0]}" --dsh-distribution "$RUNNER_TEMP/dsh-source-pack"
          else
            node scripts/tarball-smoke.mjs "${TARBALLS[0]}"
          fi

  # ---------------------------------------------------------------------------
  # THE PACK EQUIVALENCE PROOF, and WHEN it has to run again.
  #
  # A lifecycle-free `pnpm pack` is only acceptable because its content
  # equals an ordinary `pnpm pack`'s. That equality depends on the PACKAGING
  # INPUTS — the manifest, the build configuration, the preset generator, the
  # pinned pnpm — not on the source code, and not on the tests.
  #
  # So the proof is a GATED PROPERTY with a trigger, not a per-run cost: it
  # runs when the inputs differ from the recorded proof, or when no proof is
  # recorded at all. "No proof recorded" is deliberately a trigger, not a
  # pass: an unproven equality is not an unchanged one.
  #
  # The proof is SCOPED by mode. The recorded proof is an npm/Linux/Node 24
  # record, and an npm equality says nothing about a Source Mode run whose
  # dependency graph is a local tarball family — so a source run always takes
  # the trigger and compares its OWN two packs.
  # ---------------------------------------------------------------------------
  equivalence:
    name: Pack equivalence (triggered)
    needs:
      - context
      # In Source Mode BOTH packs run against the pinned distribution, so the
      # proof needs the same artifact every other source job installs.
      - source-pack
    # `source-pack` is SKIPPED in npm mode, and a skipped dependency would
    # otherwise skip this job — but `source-pack` may not be merely
    # "not failed": a source run whose distribution never arrived must not run
    # the proof against a workspace that silently fell back to the registry.
    # Hence the mode guard, which is stricter than the `!= 'failure'` idiom the
    # other consumers use.
    if: ${{ !cancelled() && needs['context'].result == 'success' && (needs['context'].outputs.mode != 'source' || needs['source-pack'].result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Download the pinned DSH source pack
        if: ${{ needs.context.outputs.mode == 'source' }}
        uses: actions/download-artifact@v8
        with:
          name: prototype-dsh-source-pack
          path: ${{ runner.temp }}/dsh-source-pack

      - name: Do the packaging inputs still match the recorded proof?
        id: trigger
        run: |
          set -euo pipefail
          if node scripts/pack-equivalence-input.mjs --check scripts/pack-equivalence-baseline.json \
               --mode "${{ needs.context.outputs.mode }}" --node 24 --platform "${{ runner.os }}"; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Report this run's packaging input digest
        run: node scripts/pack-equivalence-input.mjs --write packaging-inputs.json

      - name: Prepare the dependencies for this mode
        if: ${{ steps.trigger.outputs.needed == 'true' }}
        env:
          DSH_MODE_RESOLVED: ${{ needs.context.outputs.mode }}
        run: |
          set -euo pipefail
          node scripts/prototype-deps.mjs \
            --mode "$DSH_MODE_RESOLVED" \
            --distribution "$RUNNER_TEMP/dsh-source-pack" \
            --workspace "$GITHUB_WORKSPACE"

      # The ordinary pack runs the FULL lifecycle, so it is only paid for
      # when the trigger fires.
      - name: Build the ordinary package
        if: ${{ steps.trigger.outputs.needed == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p packs
          pnpm pack --pack-destination "$GITHUB_WORKSPACE"
          mv "$GITHUB_WORKSPACE"/xmoon76-dsh-pi-tui-*.tgz "$GITHUB_WORKSPACE/packs/"

      - name: Build the CI-only package
        if: ${{ steps.trigger.outputs.needed == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p packs-ci-only
          pnpm pack --pack-destination "$GITHUB_WORKSPACE" --config.ignore-scripts=true
          mv "$GITHUB_WORKSPACE"/xmoon76-dsh-pi-tui-*.tgz "$GITHUB_WORKSPACE/packs-ci-only/"

      - name: Compare the two packages by CONTENT
        if: ${{ steps.trigger.outputs.needed == 'true' }}
        run: |
          set -euo pipefail
          ordinary="$(ls packs/*.tgz | head -1)"
          ci_only="$(ls packs-ci-only/*.tgz | head -1)"
          node scripts/compare-tarballs.mjs --a "$ordinary" --b "$ci_only" --out packs/pack-equivalence.json

      - name: Upload the proof (and the digest this run took)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prototype-pack-equivalence
          path: |
            packaging-inputs.json
            packs/pack-equivalence.json
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # THE QUALIFIED ARTIFACT.
  #
  # It is produced HERE, and only here: after the shard aggregate proved the
  # coverage, the typecheck passed, the candidate was packed from the
  # verified build, the eight smokes and the leak gate passed against that
  # exact tarball, AND every downstream compatibility leg succeeded.
  #
  # The bytes are re-proved one last time against the pack job's digest, so
  # the artifact that earns the name is the one that was tested — not a copy
  # that happened to land in the same directory.
  # ---------------------------------------------------------------------------
  qualified:
    name: Publish the qualified artifact
    needs:
      - context
      - build
      - typecheck
      - aggregate
      - candidate
      - qualify
      - downstream
      # The equivalence JOB always runs (only its expensive steps are
      # conditional), so its verdict is either success or failure — and a
      # failure must stop the qualified artifact. There is therefore no
      # skipped case to tolerate.
      - equivalence
    # This job depends on `source-pack` TRANSITIVELY, through `build`, and a
    # skipped job in the dependency graph skips its dependents unless they
    # say otherwise. Without this condition an npm run published nothing
    # while every one of its direct dependencies had succeeded — and the
    # summary then failed on `qualified artifact is 'skipped'`, which points
    # at the wrong job.
    if: ${{ !cancelled() && needs['context'].result == 'success' && needs['build'].result == 'success' && needs['typecheck'].result == 'success' && needs['aggregate'].result == 'success' && needs['candidate'].result == 'success' && needs['qualify'].result == 'success' && needs['downstream'].result == 'success' && needs['equivalence'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download the provisional candidate
        uses: actions/download-artifact@v8
        with:
          name: prototype-provisional-candidate
          path: provisional

      - name: Re-prove the artifact is the one every gate tested
        env:
          EXPECTED_SHA256: ${{ needs.candidate.outputs.sha256 }}
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(find provisional -maxdepth 1 -type f -name 'xmoon76-dsh-pi-tui-*.tgz' -print | sort)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one tarball to qualify, found ${#TARBALLS[@]}" >&2
            exit 1
          fi
          ACTUAL="$(sha256sum "${TARBALLS[0]}" | cut -d' ' -f1)"
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "the artifact is $ACTUAL, not the qualified $EXPECTED_SHA256" >&2
            exit 1
          fi
          # The artifact keeps the PACKAGE'S OWN NAME, and it is uploaded
          # from its ORIGINAL path: a copy renamed to `qualified.tgz` would
          # not match the `xmoon76-dsh-pi-tui-*.tgz` glob a downstream
          # consumer looks for, so the qualified artifact would be unusable
          # by the very jobs it exists for.
          echo "QUALIFIED_TARBALL=${TARBALLS[0]}" >> "$GITHUB_ENV"
          echo "qualified $ACTUAL as $(basename "${TARBALLS[0]}")"

      - name: Upload the QUALIFIED artifact
        uses: actions/upload-artifact@v7
        with:
          name: prototype-qualified-candidate
          path: ${{ env.QUALIFIED_TARBALL }}
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  # The pipeline's own cost, as one number.
  #
  # The product lane is not the critical path on its own: prepare, the build,
  # the transfers and the qualification all contribute. This job reports the
  # whole path and the slowest shard, so the trade-off (wall clock against
  # runner-minutes) can be read from the run instead of estimated.
  # ---------------------------------------------------------------------------
  summary:
    name: Pipeline summary
    needs:
      - context
      - build
      - typecheck
      - product-shard
      - aggregate
      - candidate
      - qualify
      - downstream
      - qualified
      - equivalence
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The verdict is a SCRIPT, so this job needs the repository. The old
      # shell version did not (every value came from the environment), and
      # omitting the checkout made the step fail with a module-not-found
      # error instead of a verdict — measured on the first run of this fix.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # The verdict is computed by a script, not by shell, for three
      # reasons that shell made easy to get wrong:
      #
      #   - `skipped` used to be accepted as success, so a pipeline where a
      #     required phase never ran could report a green summary;
      #   - `context` was missing from the phase list entirely, so a run
      #     with no resolved dependency mode could still summarise as green;
      #   - the elapsed time was computed from the context job's start
      #     instant, and the shell treats an EMPTY operand as zero — a
      #     failed context produced a plausible-looking number instead of a
      #     diagnosis.
      #
      # Every required phase must now be `success`. A phase that did not run
      # did not prove anything.
      - name: Report the outcome of every phase
        env:
          STARTED: ${{ needs.context.outputs.started_epoch }}
          CONTEXT: ${{ needs.context.result }}
          BUILD: ${{ needs.build.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          SHARDS: ${{ needs.product-shard.result }}
          AGGREGATE: ${{ needs.aggregate.result }}
          CANDIDATE: ${{ needs.candidate.result }}
          QUALIFY: ${{ needs.qualify.result }}
          DOWNSTREAM: ${{ needs.downstream.result }}
          QUALIFIED: ${{ needs.qualified.result }}
          EQUIVALENCE: ${{ needs.equivalence.result }}
        run: |
          set -euo pipefail
          node scripts/pipeline-guard.mjs summary \
            --started "$STARTED" \
            --phase "context=$CONTEXT" \
            --phase "build=$BUILD" \
            --phase "typecheck=$TYPECHECK" \
            --phase "product shards=$SHARDS" \
            --phase "aggregate=$AGGREGATE" \
            --phase "candidate pack=$CANDIDATE" \
            --phase "qualification=$QUALIFY" \
            --phase "downstream matrix=$DOWNSTREAM" \
            --phase "qualified artifact=$QUALIFIED" \
            --phase "equivalence proof=$EQUIVALENCE" \
            | tee pipeline-summary.txt

      - name: Upload the pipeline summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prototype-summary
          path: pipeline-summary.txt
          if-no-files-found: warn
          retention-days: 3
