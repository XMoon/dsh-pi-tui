name: CI

# Repeatable build-and-publish gates (code-review plan stage G):
#   typecheck, test-pi-tui, test-dsh-pi-tui, build-and-pack,
#   tarball-smoke-node-22/24/26, npm-audit-prod, naming-gate.
# Tag pushes (v*) run the same matrix; the publish job only runs on tags
# and `needs` EVERY gate — a failing check means no publish. Publish
# downloads the artifact build-and-pack produced (the exact bytes the
# Node 22/24/26 smoke verified) and pushes those bytes to npm with
# provenance; it never rebuilds. The tag must match the package version.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The fork's dist/ is gitignored; typecheck needs its declarations.
      - run: pnpm build
      - run: pnpm typecheck

  test-pi-tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @xmoon76/pi-tui test

  test-dsh-pi-tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Both dists are gitignored: the tests import the fork at runtime and
      # the tarball smoke resolves the bundle's dist realpath.
      - run: pnpm build
      - run: pnpm --filter @xmoon76/dsh-pi-tui test

  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # prepack cleans both dists, builds the fork + the bundle, typechecks,
      # and runs the tests; postpack runs the tarball smoke test. A fresh
      # checkout with no dist therefore produces a verified tarball in one
      # command. --pack-destination puts the tarball where postpack's smoke
      # and the artifact upload expect it (pnpm would otherwise leave it in
      # the invocation's cwd — the repo root).
      - run: pnpm --filter @xmoon76/dsh-pi-tui pack --pack-destination packages/dsh-pi-tui
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-pi-tui-tarball
          # npm/pnpm strip the `@` scope from tarball filenames, so the
          # packed file is xmoon76-dsh-pi-tui-<version>.tgz.
          path: packages/dsh-pi-tui/xmoon76-dsh-pi-tui-*.tgz
          if-no-files-found: error

  tarball-smoke:
    needs: build-and-pack
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dsh-pi-tui-tarball
          path: tarball
      # Smoke the EXACT artifact build-and-pack produced: structure, leaks,
      # parse, standalone install, exports import, no external fork
      # resolution, repair CLI help + read-only scan.
      - run: node packages/dsh-pi-tui/scripts/tarball-smoke.mjs tarball/xmoon76-dsh-pi-tui-*.tgz

  naming-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Naming decisions are hard rules (AGENTS.md): package names, private
      # flags, onlyBundle, patch row ids, startup service, committed dist.
      - run: node packages/dsh-pi-tui/scripts/naming-gate.mjs

  npm-audit-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod

  # Publish @xmoon76/dsh-pi-tui to npm — ONLY on `v*` tag pushes and ONLY
  # after every gate above succeeded (needs). The vendored fork
  # (@xmoon76/pi-tui) is private and bundled into dist at build time, so
  # this publishes exactly one package. It publishes the artifact
  # build-and-pack produced — the exact bytes the Node 22/24/26 tarball
  # smoke verified — with OIDC provenance, never a rebuild.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [typecheck, test-pi-tui, test-dsh-pi-tui, build-and-pack, tarball-smoke, naming-gate, npm-audit-prod]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: dsh-pi-tui-tarball
          path: tarball
      # The release tag must name exactly the version being published.
      - name: Verify the tag matches the package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/dsh-pi-tui/package.json', 'utf8')).version)")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag $TAG does not match packages/dsh-pi-tui version v$VERSION" >&2
            exit 1
          fi
      # Publish the EXACT CI-verified bytes; never rebuild, never repack.
      # The glob must match exactly one tarball (build-and-pack packs into
      # a clean checkout, so only one can exist). Publish an ABSOLUTE path:
      # npm resolves a relative tarball argument against its cwd, which is
      # the checkout root here, but never rely on that (the smoke already
      # learned this lesson the hard way).
      - name: Publish the CI-verified tarball
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(ls tarball/xmoon76-dsh-pi-tui-*.tgz)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            exit 1
          fi
          npm publish "$GITHUB_WORKSPACE/${TARBALLS[0]}" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
