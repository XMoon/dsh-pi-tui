name: CI

on:
  push:
    branches:
      - main
      - next
    tags:
      - 'v*'
      - 'next-v*'
  pull_request:

# Default to the minimum permission required by normal CI jobs.
# The publish job explicitly adds id-token: write for npm Trusted Publishing.
permissions:
  contents: read

# Cancel superseded branch/PR runs, but never cancel release-tag runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# PARTIAL RE-RUNS. GitHub's "Re-run failed jobs" re-executes only the failed
# jobs (and their downstream dependents) of the SAME run: the successful jobs
# and their artifacts are kept, so one recovered aggregate can mix an earlier
# attempt's shard evidence with a newer attempt's. Every artifact therefore
# keeps a STABLE name and uploads with `overwrite: true`: a re-executed
# producer replaces its own artifact instead of failing on the name, and the
# downstream jobs still see one artifact per name. Nothing here trusts an
# artifact id or a name alone — the aggregate re-proves run id, checkout SHA,
# bounded attempts, partition and applied parameters from the CONTENT.

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the DSH dependency lane once. The resolver is unit-tested and keeps
  # branch/base/tag policy out of every downstream job.
  # ---------------------------------------------------------------------------
  dsh-context:
    name: Resolve DSH distribution context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.context.outputs.mode }}
      dsh_mode: ${{ steps.context.outputs.dsh_mode }}
      version: ${{ steps.context.outputs.version }}
      source_ref: ${{ steps.context.outputs.source_ref }}
      source_expected_version: ${{ steps.context.outputs.source_expected_version }}
      # The accelerated DAG's shape, resolved and validated ONCE here. No
      # consumer reads `vars.*` directly: a matrix built from one value and
      # an aggregate from another would disagree about what "all shards"
      # means, and nothing in the run would say so.
      shard_total: ${{ steps.context.outputs.shard_total }}
      shards: ${{ steps.context.outputs.shards }}
      max_parallel: ${{ steps.context.outputs.max_parallel }}
      test_concurrency: ${{ steps.context.outputs.test_concurrency }}
      effective_config: ${{ steps.context.outputs.effective_config }}
      started_epoch: ${{ steps.started.outputs.epoch }}
    steps:
      # The instant this run's first job started. It is NOT the queue time —
      # GitHub does not expose that — so the elapsed figure the summary prints
      # is a LOWER BOUND of the end-to-end wall clock, and it is labelled that
      # way. An unusable value fails the summary rather than becoming zero.
      - name: Record the DAG start instant
        id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # The shape variables are read through `env`, never interpolated into
      # shell source. An ABSENT variable is the measured default; an empty one
      # (what Actions renders an unset `vars` entry as) is the default too; a
      # nonempty INVALID one fails here, before anything is built.
      - name: Resolve mode
        id: context
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          CI_PRODUCT_SHARDS: ${{ vars.CI_PRODUCT_SHARDS }}
          CI_PRODUCT_MAX_PARALLEL: ${{ vars.CI_PRODUCT_MAX_PARALLEL }}
          CI_PRODUCT_TEST_CONCURRENCY: ${{ vars.CI_PRODUCT_TEST_CONCURRENCY }}
        run: node scripts/dsh-ci-context.mjs

  # ---------------------------------------------------------------------------
  # Build the pinned source family once. The artifact contains only official
  # release tarballs and the generated distribution manifest.
  # ---------------------------------------------------------------------------
  prepare-dsh-source:
    name: Prepare pinned DSH source pack
    needs: dsh-context
    if: ${{ needs.dsh-context.result == 'success' && needs.dsh-context.outputs.mode == 'source' }}
    runs-on: ubuntu-latest
    timeout-minutes: 135

    steps:
      - name: Checkout dsh-pi-tui
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout pinned DeepSeek Harness
        uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.dsh-context.outputs.source_ref }}
          path: deepseek-harness
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Build and pack official DSH family
        env:
          DSH_SOURCE_REF: ${{ needs.dsh-context.outputs.source_ref }}
          DSH_EXPECTED_VERSION: ${{ needs.dsh-context.outputs.source_expected_version }}
        run: |
          set -euo pipefail
          node scripts/dsh-source-pack.mjs \
            --dsh-dir "$GITHUB_WORKSPACE/deepseek-harness" \
            --ref "$DSH_SOURCE_REF" \
            --expected-version "$DSH_EXPECTED_VERSION" \
            --out "$RUNNER_TEMP/dsh-source-pack"

          mapfile -t TARBALLS < <(find "$RUNNER_TEMP/dsh-source-pack" -maxdepth 1 -type f -name '*.tgz' -print | sort)
          if [ "${#TARBALLS[@]}" -eq 0 ]; then
            echo 'official DSH source pack produced no tarballs' >&2
            exit 1
          fi
          if [ ! -f "$RUNNER_TEMP/dsh-source-pack/dsh-source-distribution.json" ]; then
            echo 'source artifact is missing dsh-source-distribution.json' >&2
            exit 1
          fi
          UNEXPECTED="$(find "$RUNNER_TEMP/dsh-source-pack" -maxdepth 1 -type f \
            ! -name '*.tgz' ! -name 'dsh-source-distribution.json' -print -quit)"
          if [ -n "$UNEXPECTED" ]; then
            echo "source artifact contains an unexpected file: $UNEXPECTED" >&2
            exit 1
          fi

      - name: Upload DSH source pack
        uses: actions/upload-artifact@v7
        with:
          name: dsh-source-pack
          path: ${{ runner.temp }}/dsh-source-pack
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Parse and validate release metadata once. Branch pushes and pull requests
  # skip this tag-only job; tag jobs consume the same outputs everywhere.
  # ---------------------------------------------------------------------------
  release-context:
    name: Resolve release context
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.context.outputs.channel }}
      version: ${{ steps.context.outputs.version }}
      npm_tag: ${{ steps.context.outputs.npm_tag }}
      is_prerelease: ${{ steps.context.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Parse release tag
        id: context
        run: node scripts/release-context.mjs "$GITHUB_REF_NAME"

  # ---------------------------------------------------------------------------
  # Source-level checks that are NOT already covered by the accelerated DAG.
  #
  # The build / typecheck / product-shard / candidate / qualify jobs already
  # run:
  #   - clean, clean:fork, build
  #   - typecheck:bundle
  #   - test:product (sharded)
  #   - the lifecycle-free candidate pack
  #   - the eight packed-artifact smokes
  #
  # So this job only checks the remaining source contracts, plus the
  # development-tooling suite (dev-environment, DSH distribution gates) that
  # must NOT run inside the artifact path.
  # ---------------------------------------------------------------------------
  source-checks:
    name: Source checks
    needs:
      - dsh-context
      - prepare-dsh-source
    if: ${{ always() && needs.dsh-context.result == 'success' && (needs.dsh-context.outputs.mode == 'npm' || needs.prepare-dsh-source.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DSH_MODE: ${{ needs.dsh-context.outputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # package.json already pins pnpm@12.11.2.
      # pnpm/setup@v2 reads that packageManager field.
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Set DSH source artifact path
        run: echo "DSH_SOURCE_ARTIFACT=$RUNNER_TEMP/dsh-source-pack" >> "$GITHUB_ENV"

      - name: Download DSH source pack
        if: env.DSH_MODE == 'source'
        uses: actions/download-artifact@v8
        with:
          name: dsh-source-pack
          path: ${{ runner.temp }}/dsh-source-pack

      - name: Prepare DSH dependency environment
        env:
          DSH_SOURCE_CONFIG: test/compat/dsh-source.json
        run: |
          set -euo pipefail
          if [ "$DSH_MODE" = source ]; then
            node scripts/prepare-dsh-test-environment.mjs \
              --mode source \
              --distribution "$DSH_SOURCE_ARTIFACT" \
              --workspace "$GITHUB_WORKSPACE" \
              --config "$DSH_SOURCE_CONFIG"
            echo 'PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false' >> "$GITHUB_ENV"
            echo 'PNPM_CONFIG_MANAGE_PACKAGE_MANAGER_VERSIONS=false' >> "$GITHUB_ENV"
            echo 'TARBALL_SMOKE_SKIP_INSTALL=1' >> "$GITHUB_ENV"
          else
            printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/dsh-npmrc"
             NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ \
               npm_config_registry=https://registry.npmjs.org/ \
               NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/dsh-npmrc" \
               npm_config_userconfig="$RUNNER_TEMP/dsh-npmrc" \
               PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false \
               PNPM_CONFIG_MANAGE_PACKAGE_MANAGER_VERSIONS=false \
               pnpm install --frozen-lockfile
             {
               echo 'NPM_CONFIG_REGISTRY=https://registry.npmjs.org/'
               echo 'npm_config_registry=https://registry.npmjs.org/'
               echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/dsh-npmrc"
               echo "npm_config_userconfig=$RUNNER_TEMP/dsh-npmrc"
             } >> "$GITHUB_ENV"
          fi

      # The Remote parity smokes import root TypeScript projections, whose
      # private pi-tui package export requires its local dist to exist.
      - name: Build vendored pi-tui before Source Mode smokes
        run: pnpm build:fork

      - name: Typecheck vendored pi-tui
        run: pnpm typecheck:fork

      - name: Typecheck performance benchmark
        run: pnpm typecheck:bench

      - name: Test vendored pi-tui
        run: pnpm test:fork

      - name: Remote Session read fixture smoke
        run: pnpm smoke:remote-session-read

      # The D1 closure gate OWNS the four same-Host parity proofs: it spawns
      # each of them itself and aggregates their results into the explicit
      # read-gap ledger (the known-skips set and the per-domain pass/comparable
      # /mismatch summary). Running them as separate CI steps as well made the
      # SAME proof execute TWICE per Source Mode run — once standalone and
      # once inside the closure.
      #
      # Each proof script stays independently invocable (`pnpm
      # smoke:remote-session-read-parity` and friends), so a developer can
      # still run one proof on its own while debugging; only the CI GRAPH
      # runs it once.
      #
      # A failing proof still fails the job: the closure rethrows the child's
      # non-zero exit with the script name and the tail of its output.
      - name: D1 closure gate
        if: env.DSH_MODE == 'source'
        run: pnpm smoke:remote-d1-closure

      - name: D2 closure smoke
        if: env.DSH_MODE == 'source'
        run: pnpm smoke:remote-d2-closure

      # The tmux terminal-tooling suite. The lane was historically named
      # `test:docs`, but it never tested `docs/**`: it proves the tmux
      # terminal tooling (the ANSI→HTML renderer and the demo driver).
      - name: Test tmux terminal tooling
        run: pnpm test:tmux

      - name: Validate installation documentation
        run: pnpm gate:installation-doc

      # Development-tooling suite: dev-environment fixtures, DSH distribution
      # gates. Kept OUT of the packed artifact path so the artifact never
      # depends on the developer git/CI environment.
      - name: Test development tooling
        run: pnpm test:tooling

      - name: Pi component compatibility contract
        run: pnpm gate:pi-surface-compat

      # Every production file a test reads by path must EXIST: a renamed or
      # moved production module would otherwise leave a source lock
      # silently pointing at a DIFFERENT file.
      - name: Verify the production reads of the test tree
        run: pnpm gate:production-reads

      # The JSON ledger is authoritative; this step proves the checked-in
      # human report is deterministic and has not been hand-edited.
      - name: Generate vendored divergence report
        run: |
          pnpm generate:pi-divergences
          git diff --exit-code -- packages/pi-tui/DIVERGENCES.md
          git diff --check -- packages/pi-tui/DIVERGENCES.md

      - name: Validate vendored divergence ledger
        run: pnpm gate:pi-divergence-ledger

      # Vendored-fork divergence gate: every local src change must be
      # covered by vendor-divergences.json against the pinned upstream
      # blobs (resolved via the codeload tarball fallback on CI).
      - name: Vendored fork divergence gate
        run: pnpm gate:pi-vendor-diff --strict

      - name: Verify naming and packaging contracts
        run: node scripts/naming-gate.mjs

  # ---------------------------------------------------------------------------
  # Build and run the Remote Session read gates against the exact DSH version
  # declared by package.json. The verifier creates a fresh npm workspace, so
  # this never inherits the branch lockfile's mixed prerelease graph. A
  # different release target is a local-only explicit compatibility probe.
  client-family-compat:
    name: DSH Client release-family compatibility
    needs: dsh-context
    if: ${{ needs.dsh-context.result == 'success' && needs.dsh-context.outputs.mode == 'npm' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Run exact current-family gates
        run: pnpm compat:dsh:client-family

  # ---------------------------------------------------------------------------
  # THE ACCELERATED DAG.
  #
  # There is ONE physical pack entry (`pnpm pack:artifact`): it reads the
  # current build output and assembles the tgz with no lifecycle hooks. The
  # work around it is explicit and individually blocking: ONE build, ONE
  # typecheck, N product shards joined by an aggregate proof, a candidate pack
  # that runs no lifecycle, and a qualification that runs the eight
  # packed-artifact smokes against the exact candidate. See
  # `docs/guides/releasing.md`.
  #
  # Every consumer proves it holds the build the build job produced, and the
  # pack proves it consumed that build: without that proof four shards can
  # test four different trees and every one of them looks green.
  # ---------------------------------------------------------------------------
  build:
    name: Build the shared artifact
    needs:
      - dsh-context
      - prepare-dsh-source
    # `always()` suppresses GitHub's implicit `success()` requirement on the
    # needs, so BOTH are named here. `prepare-dsh-source` is legitimately
    # SKIPPED in npm mode; it may not be skipped in source mode, because a
    # source run without the pinned distribution would quietly build against
    # the registry while the run claims Source Mode.
    if: ${{ always() && needs.dsh-context.result == 'success' && (needs.dsh-context.outputs.mode == 'npm' || needs.prepare-dsh-source.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DSH_MODE: ${{ needs.dsh-context.outputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Download DSH source pack
        if: env.DSH_MODE == 'source'
        uses: actions/download-artifact@v8
        with:
          name: dsh-source-pack
          path: ${{ runner.temp }}/dsh-source-pack

      - name: Prepare DSH dependency environment
        env:
          DSH_MODE_RESOLVED: ${{ needs.dsh-context.outputs.mode }}
        run: |
          set -euo pipefail
          node scripts/ci-deps.mjs \
            --mode "$DSH_MODE_RESOLVED" \
            --distribution "$RUNNER_TEMP/dsh-source-pack" \
            --workspace "$GITHUB_WORKSPACE"

      # `clean` FIRST, exactly like `pack:release`: a build that reuses a stale
      # `dist` is not the build this commit produces.
      - name: Clean and build
        run: pnpm clean && pnpm clean:fork && pnpm build

      - name: Record the build identity
        run: node scripts/build-digest.mjs --write build-digest.json

      - name: Upload the shared build
        uses: actions/upload-artifact@v7
        with:
          name: dsh-pi-tui-build
          # The build OUTPUTS only. `node_modules` is reinstalled in every
          # consumer (it is not portable), and `src` comes from the checkout.
          path: |
            dist
            packages/pi-tui/dist
            generated
            build-digest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  # ---------------------------------------------------------------------------
  # TYPECHECK, ONCE.
  #
  # It DEPENDS on the build: `tsconfig.json` includes `src` and `test`, and
  # those import `@xmoon76/pi-tui`, whose declarations live in the vendored
  # fork's BUILD output. Running it four times — once per shard — would add
  # runner-minutes and prove nothing new.
  # ---------------------------------------------------------------------------
  typecheck:
    name: Bundle typecheck
    needs:
      - dsh-context
      - prepare-dsh-source
      - build
    if: ${{ always() && needs.dsh-context.result == 'success' && needs.build.result == 'success' && (needs.dsh-context.outputs.mode == 'npm' || needs.prepare-dsh-source.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DSH_MODE: ${{ needs.dsh-context.outputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Download DSH source pack
        if: env.DSH_MODE == 'source'
        uses: actions/download-artifact@v8
        with:
          name: dsh-source-pack
          path: ${{ runner.temp }}/dsh-source-pack

      - name: Prepare DSH dependency environment
        env:
          DSH_MODE_RESOLVED: ${{ needs.dsh-context.outputs.mode }}
        run: |
          set -euo pipefail
          node scripts/ci-deps.mjs \
            --mode "$DSH_MODE_RESOLVED" \
            --distribution "$RUNNER_TEMP/dsh-source-pack" \
            --workspace "$GITHUB_WORKSPACE"

      - name: Download the shared build
        uses: actions/download-artifact@v8
        with:
          name: dsh-pi-tui-build
          path: ${{ github.workspace }}

      - name: Verify this typecheck holds the build the build job produced
        run: node scripts/build-digest.mjs --verify build-digest.json

      - name: Typecheck the bundle
        run: pnpm typecheck:bundle

  # ---------------------------------------------------------------------------
  # THE PRODUCT SHARDS: Node's own `--test-shard`, so the partition is
  # disjoint by construction and the aggregate only has to PROVE it.
  # ---------------------------------------------------------------------------
  product-shard:
    name: Product shard ${{ matrix.shard }}/${{ needs.dsh-context.outputs.shard_total }}
    needs:
      - dsh-context
      - prepare-dsh-source
      - build
    if: ${{ always() && needs.dsh-context.result == 'success' && needs.build.result == 'success' && (needs.dsh-context.outputs.mode == 'npm' || needs.prepare-dsh-source.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The SCHEDULER cap. It is not the shard count: a cap larger than the
      # shard list simply means "no extra throttling", and it never changes
      # the partition.
      max-parallel: ${{ fromJSON(needs.dsh-context.outputs.max_parallel) }}
      matrix:
        shard: ${{ fromJSON(needs.dsh-context.outputs.shards) }}
    env:
      DSH_MODE: ${{ needs.dsh-context.outputs.mode }}
      DSH_TEST_JSONL: ${{ github.workspace }}/diagnostics/cases.jsonl
      DSH_TEST_EFFECTIVE_JSON: ${{ github.workspace }}/diagnostics/effective-params.json

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Download DSH source pack
        if: env.DSH_MODE == 'source'
        uses: actions/download-artifact@v8
        with:
          name: dsh-source-pack
          path: ${{ runner.temp }}/dsh-source-pack

      - name: Prepare DSH dependency environment
        env:
          DSH_MODE_RESOLVED: ${{ needs.dsh-context.outputs.mode }}
        run: |
          set -euo pipefail
          node scripts/ci-deps.mjs \
            --mode "$DSH_MODE_RESOLVED" \
            --distribution "$RUNNER_TEMP/dsh-source-pack" \
            --workspace "$GITHUB_WORKSPACE"

      - name: Download the shared build
        uses: actions/download-artifact@v8
        with:
          name: dsh-pi-tui-build
          path: ${{ github.workspace }}

      - name: Verify this shard holds the build the build job produced
        run: node scripts/build-digest.mjs --verify build-digest.json

      - name: Run this shard
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          start=$(date +%s)
          node scripts/run-test-lane.mjs product \
            --shard=${{ matrix.shard }}/${{ needs.dsh-context.outputs.shard_total }} \
            --test-concurrency=${{ needs.dsh-context.outputs.test_concurrency }}
          end=$(date +%s)
          node scripts/runner-spec.mjs \
            --wall-clock-seconds "$((end - start))" \
            --out diagnostics/runner-spec.json

      - name: Require this shard's diagnostics
        # A SUCCESSFUL shard that produced no provenance must not be able to
        # let the aggregate reuse a stale same-name artifact from an earlier
        # attempt: all three files are what prove THIS attempt ran its shard.
        # A FAILED shard is exempt on purpose — its partial records are the
        # diagnosis the aggregate needs, and the matrix result already rejects
        # it. `success()` is GitHub's default for a step; it is written out so
        # the success-only scope is explicit next to the always() upload.
        if: success()
        run: |
          set -euo pipefail
          for file in diagnostics/cases.jsonl diagnostics/runner-spec.json diagnostics/effective-params.json; do
            if [ ! -f "$file" ]; then
              echo "the shard succeeded without $file: its evidence is incomplete" >&2
              exit 1
            fi
          done

      - name: Upload this shard's records
        # A failed test run must still deliver its RECORDS: the aggregate is
        # what decides, and an aggregate with no records cannot tell "the
        # shard failed" from "the shard never ran".
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: product-shard-${{ matrix.shard }}-node24
          path: diagnostics
          if-no-files-found: warn
          # The SHARD SLOT, never the attempt, is the artifact identity: a
          # re-run of this shard replaces this name, while the shards that were
          # not re-run keep their earlier artifact. An attempt suffix would
          # leave two directories for one slot in the aggregate.
          overwrite: true
          retention-days: 3

  # ---------------------------------------------------------------------------
  # THE AGGREGATE: the proof that the shards are the whole lane, and that each
  # one ran the shard it claims.
  #
  # `if: always()` so a FAILED or CANCELLED shard still produces a report — the
  # report then says why the set is invalid, instead of the aggregate being
  # skipped and the downstream jobs silently having no proof.
  # ---------------------------------------------------------------------------
  aggregate:
    name: Aggregate the shards
    needs:
      - dsh-context
      - product-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download every shard's records
        uses: actions/download-artifact@v8
        with:
          pattern: product-shard-*
          path: shards

      - name: Require every shard job to have SUCCEEDED
        env:
          SHARD_RESULT: ${{ needs.product-shard.result }}
        run: |
          set -euo pipefail
          # A green aggregate must never hide a failed shard. The matrix
          # result is the authority for "the job ran and passed"; the record
          # checks below are the authority for "it covered its files".
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "the product shard matrix result is '$SHARD_RESULT', not 'success'" >&2
            exit 1
          fi

      - name: Prove the shards are the whole lane
        env:
          DSH_EXPECTED_RUN_ID: ${{ github.run_id }}
          DSH_EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          # What the run CLAIMS it applied. The runner records what it
          # actually put on the child's command line, and `verify-shards`
          # compares the two: an argument accepted and then dropped is not
          # hypothetical — five CI runs were once reported as a concurrency
          # comparison while every one of them ran at Node's default.
          DSH_EXPECTED_CONCURRENCY: ${{ needs.dsh-context.outputs.test_concurrency }}
          # WHICH skip reasons are legitimate in this environment. This is a
          # qualification boundary, not a count: it does not change when the
          # number of tests changes, and it is what stops a case from quietly
          # skipping itself for a reason nobody agreed to.
          DSH_ACCEPTED_SKIPS_FILE: scripts/ci-accepted-skips.txt
        run: |
          set -euo pipefail
          # What this proves, unconditionally: the shards are a PARTITION of
          # the lane (every file exactly once, no file twice), every case's
          # outcome is one the qualification accepts, zero cases failed or
          # were cancelled, every reported file contributed cases, and the
          # identity and applied parameters are THIS run's.
          #
          # There is deliberately NO committed case or skip COUNT here. A
          # hand-maintained total is a measurement device, not a delivery
          # gate: it would have to be edited by every commit that adds a test,
          # so an ordinary PR would fail the build for doing the right thing —
          # and it would still not prove anything the partition does not.
          # The totals ARE reported in `aggregate.json`, so a deliberate
          # measurement can read them; they are not compared to a constant.
          # A case count catches MORE than these checks do — one test that
          # disappeared from a file that still runs others — and the two are
          # not equivalent. It is still not here: the number would have to be
          # edited by every commit that adds a test, which fails an ordinary
          # PR for doing the right thing. That gap is a deliberate trade, not
          # a claim that structure proves a total.
          DSH_EXPECTED_SHA="$(git rev-parse HEAD)"
          export DSH_EXPECTED_SHA
          node scripts/verify-shards.mjs \
            --shards shards \
            --total "${{ needs.dsh-context.outputs.shard_total }}" \
            --effective-config "${{ needs.dsh-context.outputs.effective_config }}" \
            --out aggregate.json

      - name: Upload the aggregate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dsh-pi-tui-aggregate
          path: aggregate.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 3

  # ---------------------------------------------------------------------------
  # THE CANDIDATE: the package built from the SAME verified build through the
  # single lifecycle-free pack entry.
  #
  # `pnpm pack:artifact` is strictly `pnpm pack --config.ignore-scripts=true`:
  # it never builds, tests or smoke-tests. This job earns the tarball and
  # records its digest; the QUALIFY job earns the qualification.
  # ---------------------------------------------------------------------------
  candidate:
    name: Build the candidate tarball
    needs:
      - dsh-context
      - prepare-dsh-source
      - build
    if: ${{ always() && needs.dsh-context.result == 'success' && needs.build.result == 'success' && (needs.dsh-context.outputs.mode == 'npm' || needs.prepare-dsh-source.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DSH_MODE: ${{ needs.dsh-context.outputs.mode }}
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Download DSH source pack
        if: env.DSH_MODE == 'source'
        uses: actions/download-artifact@v8
        with:
          name: dsh-source-pack
          path: ${{ runner.temp }}/dsh-source-pack

      - name: Prepare DSH dependency environment
        env:
          DSH_MODE_RESOLVED: ${{ needs.dsh-context.outputs.mode }}
        run: |
          set -euo pipefail
          node scripts/ci-deps.mjs \
            --mode "$DSH_MODE_RESOLVED" \
            --distribution "$RUNNER_TEMP/dsh-source-pack" \
            --workspace "$GITHUB_WORKSPACE"

      - name: Download the shared build
        uses: actions/download-artifact@v8
        with:
          name: dsh-pi-tui-build
          path: ${{ github.workspace }}

      - name: Verify the pack consumes the build the tests ran against
        run: node scripts/build-digest.mjs --verify build-digest.json

      - name: Pack WITHOUT the lifecycle
        id: pack
        run: |
          set -euo pipefail
          pnpm pack:artifact

          mapfile -t TARBALLS < <(find . -maxdepth 1 -type f -name 'xmoon76-dsh-pi-tui-*.tgz' -printf '%f\n' | sort)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            printf '%s\n' "${TARBALLS[@]}" >&2
            exit 1
          fi
          TARBALL="${TARBALLS[0]}"
          SHA256="$(sha256sum "$TARBALL" | cut -d' ' -f1)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "candidate $TARBALL $SHA256"

      - name: Upload the candidate
        uses: actions/upload-artifact@v7
        with:
          name: dsh-pi-tui-candidate
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  # ---------------------------------------------------------------------------
  # THE QUALIFICATION: every gate that makes the tarball a candidate, run
  # against the SAME tarball, after the tests and the typecheck have passed.
  #
  # The digest is re-computed HERE, from the downloaded bytes. The action's own
  # digest check reports a mismatch as a WARNING, which is not a gate, so the
  # comparison is an explicit step.
  # ---------------------------------------------------------------------------
  qualify:
    name: Qualify the candidate
    needs:
      - dsh-context
      - prepare-dsh-source
      - candidate
    if: ${{ always() && needs.dsh-context.result == 'success' && needs.candidate.result == 'success' && (needs.dsh-context.outputs.mode == 'npm' || needs.prepare-dsh-source.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_MODE: ${{ needs.dsh-context.outputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Download DSH source pack
        if: env.DSH_MODE == 'source'
        uses: actions/download-artifact@v8
        with:
          name: dsh-source-pack
          path: ${{ runner.temp }}/dsh-source-pack

      - name: Prepare DSH dependency environment
        env:
          DSH_MODE_RESOLVED: ${{ needs.dsh-context.outputs.mode }}
        run: |
          set -euo pipefail
          node scripts/ci-deps.mjs \
            --mode "$DSH_MODE_RESOLVED" \
            --distribution "$RUNNER_TEMP/dsh-source-pack" \
            --workspace "$GITHUB_WORKSPACE"

      - name: Download the candidate
        uses: actions/download-artifact@v8
        with:
          name: dsh-pi-tui-candidate
          path: candidate

      - name: Prove the candidate is the tarball the pack job produced
        env:
          EXPECTED_SHA256: ${{ needs.candidate.outputs.sha256 }}
          EXPECTED_TARBALL: ${{ needs.candidate.outputs.tarball }}
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(find candidate -maxdepth 1 -type f -name 'xmoon76-dsh-pi-tui-*.tgz' -print | sort)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one downloaded tarball, found ${#TARBALLS[@]}" >&2
            exit 1
          fi
          ACTUAL="$(sha256sum "${TARBALLS[0]}" | cut -d' ' -f1)"
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "the downloaded tarball is $ACTUAL, not the produced $EXPECTED_SHA256" >&2
            exit 1
          fi
          if [ "$(basename "${TARBALLS[0]}")" != "$EXPECTED_TARBALL" ]; then
            echo "the downloaded tarball is $(basename "${TARBALLS[0]}"), not $EXPECTED_TARBALL" >&2
            exit 1
          fi
          echo "CANDIDATE=${TARBALLS[0]}" >> "$GITHUB_ENV"
          echo "the candidate is the produced tarball ($ACTUAL)"

      # The eight packed-artifact smokes, in their fixed order, through the one
      # runner. It receives the explicit path of the one candidate; a failing
      # smoke stops the run and therefore the job.
      - name: Run the eight packed-artifact smokes
        run: pnpm smoke:release -- "$CANDIDATE"

      - name: Source leak gate
        env:
          DSH_SOURCE_ARTIFACT: ${{ runner.temp }}/dsh-source-pack
        run: |
          set -euo pipefail
          # In Source Mode the gate must know which distribution the build
          # consumed, or it cannot tell a legitimate source resolution from a
          # leak. Passing nothing would run a weaker check on the same tarball
          # and report the same green.
          if [ "$DSH_MODE" = "source" ]; then
            node scripts/dsh-source-leak-gate.mjs "$CANDIDATE" --distribution "$DSH_SOURCE_ARTIFACT"
          else
            node scripts/dsh-source-leak-gate.mjs "$CANDIDATE"
          fi

      - name: TUI startup strictness handshake
        if: env.DSH_MODE == 'npm'
        run: pnpm smoke:startup-strictness -- "$CANDIDATE"

      # A step that does not apply must SAY so. A silent skip in a
      # qualification is indistinguishable from a gate that ran and passed.
      - name: Record the npm-only smoke on a source run
        if: env.DSH_MODE == 'source'
        run: |
          echo 'NOT_APPLICABLE: the startup strictness smoke is npm-only; the Host/Client split-process job is also npm-only and is skipped in this mode; Source Mode is qualified by its own lanes'

      # The digest is checked AGAIN, after the smokes, against the value the
      # pack job recorded: a candidate replaced between the smokes and the
      # upload must not be uploaded as the one that was qualified.
      - name: Re-prove the candidate was not replaced during qualification
        env:
          EXPECTED_SHA256: ${{ needs.candidate.outputs.sha256 }}
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum "$CANDIDATE" | cut -d' ' -f1)"
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "the candidate changed during qualification: $ACTUAL, not $EXPECTED_SHA256" >&2
            exit 1
          fi

      # This artifact is PROVISIONAL: the downstream gates consume it, and it
      # has no publication authority. The qualified job below re-proves the
      # bytes and uploads the final artifact.
      - name: Upload the PROVISIONAL candidate for downstream consumption
        uses: actions/upload-artifact@v7
        with:
          name: dsh-pi-tui-provisional
          path: ${{ env.CANDIDATE }}
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  # ---------------------------------------------------------------------------
  # THE SPLIT-PROCESS QUALIFICATION, as its own job.
  #
  # Its real-OS probe takes ~5 minutes. It only needs the candidate artifact,
  # so it runs in parallel with `qualify` and the product shards. `qualified`
  # still refuses publication unless this job succeeded on a release tag, and
  # the digest is re-proven before and after the run so the probe can never
  # qualify a tarball other than the one every other gate saw.
  #
  # The smoke is npm-only AND release-tag-only: ordinary PRs and branch pushes
  # do not run it (split-process development work runs it manually under its
  # own task plan); in Source Mode this job is skipped and `ci-verdict` requires
  # exactly that `skipped`, never a silent success. On an npm release tag a
  # skipped, failed or cancelled run is a publication blocker.
  # ---------------------------------------------------------------------------
  split-process:
    name: Host/Client split-process bootstrap
    needs:
      - dsh-context
      - candidate
    # `always()` suppresses the implicit all-needs success check: in npm mode
    # the transitive `prepare-dsh-source` need is legitimately skipped, and
    # without `always()` that skip propagates into this job and leaves the
    # required split-process proof unrun. The explicit result checks and the
    # ref/tag condition below keep the gate fail-closed: only an npm release
    # tag runs it.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.dsh-context.result == 'success' && needs.candidate.result == 'success' && needs.dsh-context.outputs.mode == 'npm' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_MODE: ${{ needs.dsh-context.outputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Prepare DSH dependency environment
        env:
          DSH_MODE_RESOLVED: ${{ needs.dsh-context.outputs.mode }}
        run: |
          set -euo pipefail
          node scripts/ci-deps.mjs \
            --mode "$DSH_MODE_RESOLVED" \
            --distribution "$RUNNER_TEMP/dsh-source-pack" \
            --workspace "$GITHUB_WORKSPACE"

      - name: Download the candidate
        uses: actions/download-artifact@v8
        with:
          name: dsh-pi-tui-candidate
          path: candidate

      - name: Prove the candidate is the tarball the pack job produced
        env:
          EXPECTED_SHA256: ${{ needs.candidate.outputs.sha256 }}
          EXPECTED_TARBALL: ${{ needs.candidate.outputs.tarball }}
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(find candidate -maxdepth 1 -type f -name 'xmoon76-dsh-pi-tui-*.tgz' -print | sort)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one downloaded tarball, found ${#TARBALLS[@]}" >&2
            exit 1
          fi
          ACTUAL="$(sha256sum "${TARBALLS[0]}" | cut -d' ' -f1)"
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "the downloaded tarball is $ACTUAL, not the produced $EXPECTED_SHA256" >&2
            exit 1
          fi
          if [ "$(basename "${TARBALLS[0]}")" != "$EXPECTED_TARBALL" ]; then
            echo "the downloaded tarball is $(basename "${TARBALLS[0]}"), not $EXPECTED_TARBALL" >&2
            exit 1
          fi
          echo "CANDIDATE=${TARBALLS[0]}" >> "$GITHUB_ENV"
          echo "the candidate is the produced tarball ($ACTUAL)"

      - name: Host/Client split-process bootstrap
        run: pnpm smoke:split-process -- "$CANDIDATE"

      - name: Re-prove the candidate was not replaced during qualification
        env:
          EXPECTED_SHA256: ${{ needs.candidate.outputs.sha256 }}
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum "$CANDIDATE" | cut -d' ' -f1)"
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "the candidate changed during qualification: $ACTUAL, not $EXPECTED_SHA256" >&2
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # THE QUALIFIED ARTIFACT.
  #
  # It is produced HERE, and only here: after the shard aggregate proved the
  # coverage, the typecheck passed, the candidate was packed from the verified
  # build, the eight smokes and the leak gate passed against that exact
  # tarball, AND every downstream gate succeeded.
  #
  # The bytes are re-proved one last time against the pack job's digest, so the
  # artifact that earns the name is the one that was tested — not a copy that
  # happened to land in the same directory. Nothing is rebuilt here.
  # ---------------------------------------------------------------------------
  qualified:
    name: Publish the qualified artifact
    needs:
      - dsh-context
      - prepare-dsh-source
      - build
      - typecheck
      - product-shard
      - aggregate
      - candidate
      - qualify
      - split-process
      - source-checks
      - client-family-compat
      - compat-smoke
      - ecosystem-compat
      - official-preset-assembly
      - runtime-boundary
      - security-audit
    # This job deliberately has NO `needs.*.result` condition. A job-level gate
    # would make it `skipped` whenever any upstream phase failed — and a
    # skipped job both hides WHICH proof is missing and cannot be re-executed by
    # "Re-run failed jobs". Instead it always RUNS and fails loudly through
    # `ci-verdict` below, which is the single authority over every required and
    # mode-dependent phase. The verdict runs before any candidate is downloaded
    # or uploaded, so a failed qualification never reads a candidate that does
    # not exist and never produces the publishable artifact.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # The verdict over the WHOLE graph, from the results this job received.
      # It runs FIRST: a missing, failed or skipped upstream phase must fail
      # THIS job before any candidate is downloaded, so the failure is the
      # verdict's and the publishable artifact is never produced. `ci-verdict`
      # is the single authority — this job deliberately duplicates no status
      # list in shell.
      - name: Require every upstream phase to have SUCCEEDED
        env:
          DSH_MODE: ${{ needs.dsh-context.outputs.mode }}
        run: |
          set -euo pipefail
          node scripts/ci-verdict.mjs qualify \
            --mode "$DSH_MODE" \
            --ref "$GITHUB_REF" \
            --phase "dsh-context=${{ needs.dsh-context.result }}" \
            --phase "prepare-dsh-source=${{ needs['prepare-dsh-source'].result }}" \
            --phase "client-family-compat=${{ needs['client-family-compat'].result }}" \
            --phase "build=${{ needs.build.result }}" \
            --phase "typecheck=${{ needs.typecheck.result }}" \
            --phase "product-shard=${{ needs.product-shard.result }}" \
            --phase "aggregate=${{ needs.aggregate.result }}" \
            --phase "candidate=${{ needs.candidate.result }}" \
            --phase "qualify=${{ needs.qualify.result }}" \
            --phase "split-process=${{ needs['split-process'].result }}" \
            --phase "source-checks=${{ needs['source-checks'].result }}" \
            --phase "compat-smoke=${{ needs['compat-smoke'].result }}" \
            --phase "ecosystem-compat=${{ needs['ecosystem-compat'].result }}" \
            --phase "official-preset-assembly=${{ needs['official-preset-assembly'].result }}" \
            --phase "runtime-boundary=${{ needs['runtime-boundary'].result }}" \
            --phase "security-audit=${{ needs['security-audit'].result }}"

      - name: Download the provisional candidate
        uses: actions/download-artifact@v8
        with:
          name: dsh-pi-tui-provisional
          path: provisional

      - name: Re-prove the artifact is the one every gate tested
        env:
          EXPECTED_SHA256: ${{ needs.candidate.outputs.sha256 }}
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(find provisional -maxdepth 1 -type f -name 'xmoon76-dsh-pi-tui-*.tgz' -print | sort)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one tarball to qualify, found ${#TARBALLS[@]}" >&2
            exit 1
          fi
          ACTUAL="$(sha256sum "${TARBALLS[0]}" | cut -d' ' -f1)"
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "the artifact is $ACTUAL, not the qualified $EXPECTED_SHA256" >&2
            exit 1
          fi
          # The artifact keeps the PACKAGE'S OWN NAME, and it is uploaded from
          # its ORIGINAL path: a copy renamed to `qualified.tgz` would not match
          # the `xmoon76-dsh-pi-tui-*.tgz` glob a downstream consumer looks for,
          # so the qualified artifact would be unusable by the very jobs it
          # exists for.
          echo "QUALIFIED_TARBALL=${TARBALLS[0]}" >> "$GITHUB_ENV"
          echo "qualified $ACTUAL as $(basename "${TARBALLS[0]}")"

      - name: Upload the QUALIFIED artifact
        uses: actions/upload-artifact@v7
        with:
          name: dsh-pi-tui-tarball
          path: ${{ env.QUALIFIED_TARBALL }}
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The pipeline's own cost and verdict, as one record.
  #
  # It runs `always()` so a failed run still reports WHICH phase failed, and it
  # requires the qualified artifact as well: a summary that calls a run green
  # while no publishable artifact exists is worse than no summary.
  # ---------------------------------------------------------------------------
  summary:
    name: Pipeline summary
    needs:
      - dsh-context
      - prepare-dsh-source
      - build
      - typecheck
      - product-shard
      - aggregate
      - candidate
      - qualify
      - split-process
      - qualified
      - source-checks
      - client-family-compat
      - compat-smoke
      - ecosystem-compat
      - official-preset-assembly
      - runtime-boundary
      - security-audit
      - release-context
      - release-metadata
      - release-packed-check
      - publish
      - release
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Report the outcome of every phase
        env:
          DSH_MODE: ${{ needs.dsh-context.outputs.mode }}
          EFFECTIVE_CONFIG: ${{ needs.dsh-context.outputs.effective_config }}
          STARTED: ${{ needs.dsh-context.outputs.started_epoch }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          RELEASE_ARG=""
          if [ "$IS_RELEASE" = "true" ]; then RELEASE_ARG="--release"; fi
          echo "effective configuration: ${EFFECTIVE_CONFIG:-<unresolved>}"
          node scripts/ci-verdict.mjs summary \
            --mode "$DSH_MODE" \
            --ref "$GITHUB_REF" \
            --started "${STARTED:-}" \
            $RELEASE_ARG \
            --phase "dsh-context=${{ needs.dsh-context.result }}" \
            --phase "prepare-dsh-source=${{ needs['prepare-dsh-source'].result }}" \
            --phase "client-family-compat=${{ needs['client-family-compat'].result }}" \
            --phase "build=${{ needs.build.result }}" \
            --phase "typecheck=${{ needs.typecheck.result }}" \
            --phase "product-shard=${{ needs['product-shard'].result }}" \
            --phase "aggregate=${{ needs.aggregate.result }}" \
            --phase "candidate=${{ needs.candidate.result }}" \
            --phase "qualify=${{ needs.qualify.result }}" \
            --phase "split-process=${{ needs['split-process'].result }}" \
            --phase "source-checks=${{ needs['source-checks'].result }}" \
            --phase "compat-smoke=${{ needs['compat-smoke'].result }}" \
            --phase "ecosystem-compat=${{ needs['ecosystem-compat'].result }}" \
            --phase "official-preset-assembly=${{ needs['official-preset-assembly'].result }}" \
            --phase "runtime-boundary=${{ needs['runtime-boundary'].result }}" \
            --phase "security-audit=${{ needs['security-audit'].result }}" \
            --phase "qualified=${{ needs.qualified.result }}" \
            --phase "release-context=${{ needs['release-context'].result }}" \
            --phase "release-metadata=${{ needs['release-metadata'].result }}" \
            --phase "release-packed-check=${{ needs['release-packed-check'].result }}" \
            --phase "publish=${{ needs.publish.result }}" \
            --phase "release=${{ needs.release.result }}" \
            | tee pipeline-summary.txt

      - name: Upload the pipeline report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dsh-pi-tui-pipeline-summary
          path: pipeline-summary.txt
          if-no-files-found: warn
          overwrite: true
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Test the EXACT packed artifact against the supported Node.js boundaries.
  #
  # Important:
  #   22.19.0 = minimum Node 22 supported by package.json
  #   24.0.0  = minimum Node 24 covered by >=24
  #   26      = current/newer supported major
  #
  # Node 24 used during qualification already runs every packed-artifact smoke.
  # The matrix additionally performs a clean fresh install; Source Mode injects
  # the validated local DSH tarball closure into that probe.
  # ---------------------------------------------------------------------------
  compat-smoke:
    name: Tarball smoke / Node ${{ matrix.node }}
    needs:
      - dsh-context
      - prepare-dsh-source
      - qualify
    if: ${{ always() && needs.dsh-context.result == 'success' && needs.qualify.result == 'success' && (needs.dsh-context.outputs.mode == 'npm' || needs.prepare-dsh-source.result == 'success') }}

    runs-on: ubuntu-latest
    env:
      DSH_MODE: ${{ needs.dsh-context.outputs.mode }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node:
          - '22.19.0'
          - '24.0.0'
          - '26'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false

      # The source probe is intentionally independent of this checkout's
      # node_modules, lockfile, and workspace metadata. npm mode retains the
      # existing workspace install for its registry-backed lane.
      - name: Set DSH source artifact path
        run: echo "DSH_SOURCE_ARTIFACT=$RUNNER_TEMP/dsh-source-pack" >> "$GITHUB_ENV"

      - name: Download DSH source pack
        if: env.DSH_MODE == 'source'
        uses: actions/download-artifact@v8
        with:
          name: dsh-source-pack
          path: ${{ runner.temp }}/dsh-source-pack

      - name: Prepare npm dependency environment
        if: env.DSH_MODE == 'npm'
        run: |
          set -euo pipefail
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/dsh-npmrc"
          NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ \
            npm_config_registry=https://registry.npmjs.org/ \
            NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/dsh-npmrc" \
            npm_config_userconfig="$RUNNER_TEMP/dsh-npmrc" \
            PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false \
            PNPM_CONFIG_MANAGE_PACKAGE_MANAGER_VERSIONS=false \
            pnpm install --frozen-lockfile
          {
            echo 'NPM_CONFIG_REGISTRY=https://registry.npmjs.org/'
            echo 'npm_config_registry=https://registry.npmjs.org/'
            echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/dsh-npmrc"
            echo "npm_config_userconfig=$RUNNER_TEMP/dsh-npmrc"
          } >> "$GITHUB_ENV"

      # The PROVISIONAL artifact: these gates must run before the final
      # qualified artifact exists, and none of them has publication authority.
      - name: Download the provisional candidate
        uses: actions/download-artifact@v8
        with:
          name: dsh-pi-tui-provisional
          path: tarball

      - name: Smoke-test release tarball
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t TARBALLS < <(
            find tarball -maxdepth 1 -type f \
              -name 'xmoon76-dsh-pi-tui-*.tgz' \
              -print \
              | sort
          )

          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            printf '%s\n' "${TARBALLS[@]}" >&2
            exit 1
          fi

          if [ "$DSH_MODE" = source ]; then
            node scripts/tarball-smoke.mjs "${TARBALLS[0]}" --dsh-distribution "$DSH_SOURCE_ARTIFACT"
          else
            node scripts/tarball-smoke.mjs "${TARBALLS[0]}"
          fi

  # ---------------------------------------------------------------------------
  # Test the EXACT packed artifact against the published pi2dsh bridge and a
  # real Pi component in a real pseudo-terminal. This is intentionally outside
  # the packed-artifact runner: local packing stays offline and non-interactive. The published
  # ecosystem is evaluated in BOTH modes: the smoke installs the published DSH
  # and pi2dsh from the registry, at the pairing the ecosystem manifest
  # declares — an external consumer pairing, not this checkout's DSH target — so
  # Source Mode does not skip it. A failing pi2dsh peer declaration is an
  # ECOSYSTEM_CONTRACT_BLOCKER, never a forced install.
  # ---------------------------------------------------------------------------
  ecosystem-compat:
    name: External compatibility / pi2dsh
    needs:
      - dsh-context
      - prepare-dsh-source
      - qualify
    if: ${{ always() && needs.dsh-context.result == 'success' && needs.qualify.result == 'success' && (needs.dsh-context.outputs.mode == 'npm' || needs.prepare-dsh-source.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DSH_MODE: ${{ needs.dsh-context.outputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Prepare npm dependency environment
        run: |
          set -euo pipefail
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/dsh-npmrc"
          NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ \
            npm_config_registry=https://registry.npmjs.org/ \
            NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/dsh-npmrc" \
            npm_config_userconfig="$RUNNER_TEMP/dsh-npmrc" \
            PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false \
            PNPM_CONFIG_MANAGE_PACKAGE_MANAGER_VERSIONS=false \
            pnpm install --frozen-lockfile
          {
            echo 'NPM_CONFIG_REGISTRY=https://registry.npmjs.org/'
            echo 'npm_config_registry=https://registry.npmjs.org/'
            echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/dsh-npmrc"
            echo "npm_config_userconfig=$RUNNER_TEMP/dsh-npmrc"
          } >> "$GITHUB_ENV"

      # The PROVISIONAL artifact: these gates must run before the final
      # qualified artifact exists, and none of them has publication authority.
      - name: Download the provisional candidate
        uses: actions/download-artifact@v8
        with:
          name: dsh-pi-tui-provisional
          path: tarball

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Run pi2dsh compatibility smoke
        env:
          PI2DSH_COMPAT_DEBUG_DIR: pi2dsh-compat-debug
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t TARBALLS < <(
            find tarball -maxdepth 1 -type f \
              -name 'xmoon76-dsh-pi-tui-*.tgz' \
              -print \
              | sort
          )

          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            printf '%s\n' "${TARBALLS[@]}" >&2
            exit 1
          fi

          # The NARROW stale-peer allowance: only a TUI-peer-only metadata
          # mismatch proceeds to the targeted real runtime smoke (whose
          # result decides). DSH peer mismatches, missing dsh peers, and
          # runtime/fixture failures stay blocking.
          node scripts/pi2dsh-compat-smoke.mjs "${TARBALLS[0]}" --allow-stale-tui-peer

      - name: Upload pi2dsh compatibility diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pi2dsh-compat-debug
          path: pi2dsh-compat-debug
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Verify the EXACT packed artifact against every official DSH preset without
  # consulting any published consumer metadata. This remains runnable when
  # pi2dsh is behind the target release line.
  # ---------------------------------------------------------------------------
  official-preset-assembly:
    name: Official DSH preset assembly
    needs:
      - dsh-context
      - prepare-dsh-source
      - qualify
    if: ${{ always() && needs.dsh-context.result == 'success' && needs.qualify.result == 'success' && (needs.dsh-context.outputs.mode == 'npm' || needs.prepare-dsh-source.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DSH_MODE: ${{ needs.dsh-context.outputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Set DSH source artifact path
        run: echo "DSH_SOURCE_ARTIFACT=$RUNNER_TEMP/dsh-source-pack" >> "$GITHUB_ENV"

      - name: Download DSH source pack
        if: env.DSH_MODE == 'source'
        uses: actions/download-artifact@v8
        with:
          name: dsh-source-pack
          path: ${{ runner.temp }}/dsh-source-pack

      - name: Prepare DSH dependency environment
        env:
          DSH_SOURCE_CONFIG: test/compat/dsh-source.json
        run: |
          set -euo pipefail
          if [ "$DSH_MODE" = source ]; then
            node scripts/prepare-dsh-test-environment.mjs \
              --mode source \
              --distribution "$DSH_SOURCE_ARTIFACT" \
              --workspace "$GITHUB_WORKSPACE" \
              --config "$DSH_SOURCE_CONFIG"
            echo 'PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false' >> "$GITHUB_ENV"
            echo 'PNPM_CONFIG_MANAGE_PACKAGE_MANAGER_VERSIONS=false' >> "$GITHUB_ENV"
            echo 'TARBALL_SMOKE_SKIP_INSTALL=1' >> "$GITHUB_ENV"
          else
            printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/dsh-npmrc"
             NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ \
               npm_config_registry=https://registry.npmjs.org/ \
               NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/dsh-npmrc" \
               npm_config_userconfig="$RUNNER_TEMP/dsh-npmrc" \
               PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false \
               PNPM_CONFIG_MANAGE_PACKAGE_MANAGER_VERSIONS=false \
               pnpm install --frozen-lockfile
             {
               echo 'NPM_CONFIG_REGISTRY=https://registry.npmjs.org/'
               echo 'npm_config_registry=https://registry.npmjs.org/'
               echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/dsh-npmrc"
               echo "npm_config_userconfig=$RUNNER_TEMP/dsh-npmrc"
             } >> "$GITHUB_ENV"
          fi

      # The PROVISIONAL artifact: these gates must run before the final
      # qualified artifact exists, and none of them has publication authority.
      - name: Download the provisional candidate
        uses: actions/download-artifact@v8
        with:
          name: dsh-pi-tui-provisional
          path: tarball

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Run official preset assembly smoke
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(
            find tarball -maxdepth 1 -type f \
              -name 'xmoon76-dsh-pi-tui-*.tgz' \
              -print \
              | sort
          )
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            printf '%s\n' "${TARBALLS[@]}" >&2
            exit 1
          fi
          if [ "$DSH_MODE" = source ]; then
            node scripts/official-presets-smoke.mjs "${TARBALLS[0]}" --distribution "$DSH_SOURCE_ARTIFACT"
          else
            node scripts/official-presets-smoke.mjs "${TARBALLS[0]}"
          fi

  # ---------------------------------------------------------------------------
  # Verify the EXACT packed artifact rejects the old Harness. The unsupported
  # runtime is a nonzero boundary check; the startup's friendly guidance is
  # best-effort because DSH Loader mounts profile entries concurrently.
  # ---------------------------------------------------------------------------
  runtime-boundary:
    name: Runtime boundary / old DSH rejection
    needs:
      - dsh-context
      - prepare-dsh-source
      - qualify
    if: ${{ always() && needs.dsh-context.result == 'success' && needs.qualify.result == 'success' && (needs.dsh-context.outputs.mode == 'npm' || needs.prepare-dsh-source.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      # The PROVISIONAL artifact: these gates must run before the final
      # qualified artifact exists, and none of them has publication authority.
      - name: Download the provisional candidate
        uses: actions/download-artifact@v8
        with:
          name: dsh-pi-tui-provisional
          path: tarball

      # The smoke script runs from the repo root and imports devDependencies
      # (semver since the alpha.4 baseline); every other CI job installs the
      # workspace, this one must too or the import fails with
      # ERR_MODULE_NOT_FOUND. The harness it drives is a separate isolated
      # directory, so the workspace install does not affect the boundary
      # semantics under test.
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run expected-rejection smoke
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(
            find tarball -maxdepth 1 -type f \
              -name 'xmoon76-dsh-pi-tui-*.tgz' \
              -print \
              | sort
          )
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            printf '%s\n' "${TARBALLS[@]}" >&2
            exit 1
          fi
          node scripts/dsh-runtime-boundary-smoke.mjs "${TARBALLS[0]}"

  # ---------------------------------------------------------------------------
  # Production dependency security gate.
  #
  # Block releases for high/critical vulnerabilities.
  # Lower-severity advisory monitoring can be handled separately instead of
  # making unrelated releases fail because of a new moderate advisory.
  # ---------------------------------------------------------------------------
  security-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm audit operates from the lockfile and does not require node_modules.
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # ---------------------------------------------------------------------------
  # Extract the bilingual release notes for the tag from the changelogs.
  #
  # This is a SEPARATE job (not folded into the GitHub Release job) so that a
  # changelog problem fails BEFORE npm publish: the publish gate below depends
  # on it. The script verifies, in one pass:
  #
  #   - parsed tag version == package.json version
  #   - CHANGELOG.md has a ## [<version>] section
  #   - CHANGELOG.en.md has the same section
  #   - the two section headings (version + date) match exactly
  #
  # The notes body is the human-written changelog verbatim, never a commit
  # message dump or AI summary.
  # ---------------------------------------------------------------------------
  release-metadata:
    name: Prepare release metadata

    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - release-context

    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Extract release notes
        run: |
          set -euo pipefail

          node scripts/release-notes.mjs \
            "$GITHUB_REF_NAME" \
            release-notes.md

          echo 'Release notes:'
          cat release-notes.md

      - name: Upload release metadata
        uses: actions/upload-artifact@v7
        with:
          name: dsh-pi-tui-release-notes
          path: release-notes.md
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # ---------------------------------------------------------------------------
  # F6b — the packed SIXEL release gate.
  #
  # The one place this check belongs: on a release tag, against the FINAL tarball
  # that `publish` will publish, BEFORE publication. It proves the artifact
  # through the REAL loader: tarball → standalone install → `dsh plugin add` into
  # an isolated DSH_HOME → the `dsh` CLI under a PTY → `/image` → the Screen's DCS
  # → decoded pixels. A failure here blocks `publish`.
  #
  # It is deliberately NOT a per-PR product-lane case: that lane provisions
  # neither a packed tarball nor the `dsh` CLI, and a qualification lane must not
  # carry a skip for a capability it cannot provide.
  # ---------------------------------------------------------------------------
  release-packed-check:
    name: Packed SIXEL release check (F6b)
    needs:
      - dsh-context
      - qualified
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.dsh-context.result == 'success' && needs.qualified.result == 'success' && needs.dsh-context.outputs.mode == 'npm' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install the workspace (npm mode)
        run: |
          set -euo pipefail
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/dsh-npmrc"
          NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ \
            npm_config_registry=https://registry.npmjs.org/ \
            NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/dsh-npmrc" \
            npm_config_userconfig="$RUNNER_TEMP/dsh-npmrc" \
            PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false \
            PNPM_CONFIG_MANAGE_PACKAGE_MANAGER_VERSIONS=false \
            pnpm install --frozen-lockfile
          {
            echo 'NPM_CONFIG_REGISTRY=https://registry.npmjs.org/'
            echo 'npm_config_registry=https://registry.npmjs.org/'
            echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/dsh-npmrc"
            echo "npm_config_userconfig=$RUNNER_TEMP/dsh-npmrc"
          } >> "$GITHUB_ENV"

      - name: Download the qualified tarball
        uses: actions/download-artifact@v8
        with:
          name: dsh-pi-tui-tarball
          path: tarball

      - name: Provision the matrix's DSH CLI
        run: |
          set -euo pipefail
          VERSION="$(node --input-type=module -e "import('./scripts/lib/dsh-compat.mjs').then(m => process.stdout.write(m.COMPAT_MATRIX.current.upgradeDsh))")"
          echo "dsh CLI version: $VERSION"
          npm install --prefix "$RUNNER_TEMP/dsh-cli" --no-audit --no-fund --loglevel=error "@deepseek-ai/dsh@$VERSION"
          echo "$RUNNER_TEMP/dsh-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Prove the packed artifact carries the SIXEL chain
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(
            find tarball -maxdepth 1 -type f -name 'xmoon76-dsh-pi-tui-*.tgz' -print | sort
          )
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            printf '%s\n' "${TARBALLS[@]}" >&2
            exit 1
          fi
          node --import tsx/esm scripts/sixel-packed-verification.mjs "${TARBALLS[0]}"

  # ---------------------------------------------------------------------------
  # Publish the EXACT artifact produced by `qualified` — never the provisional
  # one, and never a rebuild.
  #
  # Requirements on npmjs.com Trusted Publisher:
  #
  #   Organization/User: XMoon
  #   Repository:        dsh-pi-tui
  #   Workflow filename: ci.yml
  #   Allowed action:    npm publish
  #
  # No NPM_TOKEN is used.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to npm

    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.dsh-context.result == 'success' && needs.release-context.result == 'success' && needs.source-checks.result == 'success' && needs.qualified.result == 'success' && needs.client-family-compat.result == 'success' && needs.compat-smoke.result == 'success' && needs.ecosystem-compat.result == 'success' && needs.official-preset-assembly.result == 'success' && needs.runtime-boundary.result == 'success' && needs.security-audit.result == 'success' && needs.release-metadata.result == 'success' && needs.release-packed-check.result == 'success' && needs.dsh-context.outputs.mode == 'npm' }}

    needs:
      - dsh-context
      - client-family-compat
      - release-context
      - source-checks
      - qualified
      - compat-smoke
      - ecosystem-compat
      - official-preset-assembly
      - runtime-boundary
      - security-audit
      - release-metadata
      - release-packed-check

    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure isolated public npm registry
        run: |
          set -euo pipefail
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/dsh-publish-npmrc"
          {
            echo 'NPM_CONFIG_REGISTRY=https://registry.npmjs.org/'
            echo 'npm_config_registry=https://registry.npmjs.org/'
            echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/dsh-publish-npmrc"
            echo "npm_config_userconfig=$RUNNER_TEMP/dsh-publish-npmrc"
          } >> "$GITHUB_ENV"

      - name: Assert release uses npm DSH mode
        env:
          DSH_MODE: ${{ needs.dsh-context.outputs.mode }}
        run: |
          set -euo pipefail
          test "$DSH_MODE" = npm

      # No checkout is needed here.
      #
      # The release job only receives the already-tested tarball. This makes
      # the publication boundary smaller and avoids accidentally publishing
      # rebuilt or modified workspace contents.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download release tarball
        uses: actions/download-artifact@v8
        with:
          name: dsh-pi-tui-tarball
          path: tarball

      # Verify the release tag against package.json INSIDE the actual artifact,
      # rather than against another checkout.
      - name: Verify release artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t TARBALLS < <(
            find tarball -maxdepth 1 -type f \
              -name 'xmoon76-dsh-pi-tui-*.tgz' \
              -print \
              | sort
          )

          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            printf '%s\n' "${TARBALLS[@]}" >&2
            exit 1
          fi

          TARBALL="${TARBALLS[0]}"

          VERSION="$(
            tar -xOf "$TARBALL" package/package.json |
              node -e "
                const fs = require('node:fs');
                const pkg = JSON.parse(fs.readFileSync(0, 'utf8'));
                process.stdout.write(pkg.version);
              "
          )"

          TAG="${GITHUB_REF_NAME}"

          EXPECTED_VERSION="${{ needs.release-context.outputs.version }}"

          if [ "$VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Artifact version $VERSION does not match parsed release version $EXPECTED_VERSION" >&2
            exit 1
          fi

          echo "Publishing:"
          echo "  tag:     $TAG"
          echo "  version: $VERSION"
          echo "  tarball: $TARBALL"
          echo "  sha256:  $(sha256sum "$TARBALL" | awk '{print $1}')"
          echo "  node:    $(node --version)"
          echo "  npm:     $(npm --version)"

          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish "./${{ steps.package.outputs.tarball }}" --access public --tag "${{ needs.release-context.outputs.npm_tag }}" --registry=https://registry.npmjs.org/

  # ---------------------------------------------------------------------------
  # Create the GitHub Release AFTER npm publish succeeded, so a visible
  # Release always means the same version is already on npm.
  #
  # The assets are the SAME artifact chain as npm: the candidate packed from
  # the verified build, qualified by the smokes and the leak gate, gated by
  # compat-smoke and the pi2dsh ecosystem gate, joined by `qualified`, then
  # published by publish — never a rebuild. A SHA256 file rides along for
  # download verification.
  #
  # The job is re-runnable: an existing release is edited in place and assets
  # are uploaded with --clobber.
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release

    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.dsh-context.result == 'success' && needs.release-context.result == 'success' && needs.publish.result == 'success' && needs.qualified.result == 'success' && needs.release-metadata.result == 'success' && needs.dsh-context.outputs.mode == 'npm' }}

    needs:
      - dsh-context
      - release-context
      - publish
      - qualified
      - release-metadata

    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Assert release uses npm DSH mode
        env:
          DSH_MODE: ${{ needs.dsh-context.outputs.mode }}
        run: |
          set -euo pipefail
          test "$DSH_MODE" = npm

      - name: Download release tarball
        uses: actions/download-artifact@v8
        with:
          name: dsh-pi-tui-tarball
          path: release-assets

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: dsh-pi-tui-release-notes
          path: release-metadata

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t TARBALLS < <(
            find release-assets -maxdepth 1 -type f \
              -name 'xmoon76-dsh-pi-tui-*.tgz' \
              -print \
              | sort
          )

          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            printf '%s\n' "${TARBALLS[@]}" >&2
            exit 1
          fi

          TARBALL="${TARBALLS[0]}"
          BASENAME="$(basename "$TARBALL")"
          CHECKSUM="${TARBALL}.sha256"

          (
            cd "$(dirname "$TARBALL")"
            sha256sum "$BASENAME" > "${BASENAME}.sha256"
          )

          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

          echo "Release assets:"
          ls -lh "$TARBALL" "$CHECKSUM"
          cat "$CHECKSUM"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
          IS_PRERELEASE: ${{ needs.release-context.outputs.is_prerelease }}
          TARBALL: ${{ steps.assets.outputs.tarball }}
          CHECKSUM: ${{ steps.assets.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$RELEASE_VERSION"

          RELEASE_STATE_ARGS=(--prerelease=false)

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            RELEASE_STATE_ARGS=(--prerelease)
          fi

          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            echo "Updating existing release $TAG"

            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "dsh-pi-tui $VERSION" "${RELEASE_STATE_ARGS[@]}" \
              --notes-file release-metadata/release-notes.md
          else
            echo "Creating release $TAG"

            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "dsh-pi-tui $VERSION" "${RELEASE_STATE_ARGS[@]}" \
              --notes-file release-metadata/release-notes.md
          fi

          gh release upload "$TAG" \
            "$TARBALL" \
            "$CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
