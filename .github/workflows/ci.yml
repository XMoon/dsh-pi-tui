name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

# Default to the minimum permission required by normal CI jobs.
# The publish job explicitly adds id-token: write for npm Trusted Publishing.
permissions:
  contents: read

# Cancel superseded branch/PR runs, but never cancel release-tag runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ---------------------------------------------------------------------------
  # Source-level checks that are NOT already covered by package prepack.
  #
  # package.json prepack already runs:
  #   - clean
  #   - clean:fork
  #   - build
  #   - typecheck:bundle
  #   - test:bundle
  #
  # So this job only checks the remaining source contracts.
  # ---------------------------------------------------------------------------
  source-checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # package.json already pins pnpm@11.7.0.
      # pnpm/setup@v2 reads that packageManager field.
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck vendored pi-tui
        run: pnpm typecheck:fork

      - name: Test vendored pi-tui
        run: pnpm test:fork

      # This was missing from the previous CI.
      - name: Test documentation
        run: pnpm test:docs

      - name: Verify naming and packaging contracts
        run: node scripts/naming-gate.mjs

  # ---------------------------------------------------------------------------
  # Build the ONE artifact that is tested and eventually published.
  #
  # pnpm pack invokes the package lifecycle:
  #
  # prepack:
  #   clean
  #   clean:fork
  #   build
  #   typecheck:bundle
  #   test:bundle
  #
  # postpack:
  #   tarball-smoke
  #   extension-fixture-smoke
  #   advanced-plugin-smoke
  #   phase4-plugin-smoke
  #   unstable-plugin-smoke
  #   vim-plugin-smoke
  #   examples-plugin-smoke
  #
  # Do NOT rebuild in later jobs.
  # ---------------------------------------------------------------------------
  build-and-pack:
    name: Build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, test and pack
        run: |
          set -euo pipefail

          # Prevent stale local artifacts from accidentally matching the glob.
          rm -f xmoon76-dsh-pi-tui-*.tgz

          pnpm pack --pack-destination .

      - name: Verify packed artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t TARBALLS < <(
            find . -maxdepth 1 -type f \
              -name 'xmoon76-dsh-pi-tui-*.tgz' \
              -printf '%f\n' \
              | sort
          )

          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            printf '%s\n' "${TARBALLS[@]}" >&2
            exit 1
          fi

          TARBALL="${TARBALLS[0]}"

          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

          echo "Artifact:"
          ls -lh "$TARBALL"

          echo
          echo "SHA256:"
          sha256sum "$TARBALL"

      - name: Upload release tarball
        uses: actions/upload-artifact@v7
        with:
          name: dsh-pi-tui-tarball
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Test the EXACT packed artifact against the supported Node.js boundaries.
  #
  # Important:
  #   22.19.0 = minimum Node 22 supported by package.json
  #   24.0.0  = minimum Node 24 covered by >=24
  #   26      = current/newer supported major
  #
  # Node 24 used during pack already runs every postpack smoke.
  # This matrix therefore only needs the broad tarball acceptance smoke.
  # ---------------------------------------------------------------------------
  compat-smoke:
    name: Tarball smoke / Node ${{ matrix.node }}
    needs:
      - build-and-pack

    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node:
          - '22.19.0'
          - '24.0.0'
          - '26'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false

      # Keep dev dependencies available because tarball-smoke optionally
      # uses tooling such as TypeScript from the workspace.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download release tarball
        uses: actions/download-artifact@v8
        with:
          name: dsh-pi-tui-tarball
          path: tarball

      - name: Smoke-test release tarball
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t TARBALLS < <(
            find tarball -maxdepth 1 -type f \
              -name 'xmoon76-dsh-pi-tui-*.tgz' \
              -print \
              | sort
          )

          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            printf '%s\n' "${TARBALLS[@]}" >&2
            exit 1
          fi

          node scripts/tarball-smoke.mjs "${TARBALLS[0]}"

  # ---------------------------------------------------------------------------
  # Production dependency security gate.
  #
  # Block releases for high/critical vulnerabilities.
  # Lower-severity advisory monitoring can be handled separately instead of
  # making unrelated releases fail because of a new moderate advisory.
  # ---------------------------------------------------------------------------
  security-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm audit operates from the lockfile and does not require node_modules.
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # ---------------------------------------------------------------------------
  # Extract the bilingual release notes for the tag from the changelogs.
  #
  # This is a SEPARATE job (not folded into the GitHub Release job) so that a
  # changelog problem fails BEFORE npm publish: the publish gate below depends
  # on it. The script verifies, in one pass:
  #
  #   - tag == package.json version
  #   - CHANGELOG.md has a ## [<version>] section
  #   - CHANGELOG.en.md has the same section
  #   - the two section headings (version + date) match exactly
  #
  # The notes body is the human-written changelog verbatim, never a commit
  # message dump or AI summary.
  # ---------------------------------------------------------------------------
  release-metadata:
    name: Prepare release metadata

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Extract release notes
        run: |
          set -euo pipefail

          node scripts/release-notes.mjs \
            "$GITHUB_REF_NAME" \
            release-notes.md

          echo 'Release notes:'
          cat release-notes.md

      - name: Upload release metadata
        uses: actions/upload-artifact@v7
        with:
          name: dsh-pi-tui-release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Publish the EXACT artifact produced by build-and-pack.
  #
  # Requirements on npmjs.com Trusted Publisher:
  #
  #   Organization/User: XMoon
  #   Repository:        dsh-pi-tui
  #   Workflow filename: ci.yml
  #   Allowed action:    npm publish
  #
  # No NPM_TOKEN is used.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to npm

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - source-checks
      - build-and-pack
      - compat-smoke
      - security-audit
      - release-metadata

    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write

    steps:
      # No checkout is needed here.
      #
      # The release job only receives the already-tested tarball. This makes
      # the publication boundary smaller and avoids accidentally publishing
      # rebuilt or modified workspace contents.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download release tarball
        uses: actions/download-artifact@v8
        with:
          name: dsh-pi-tui-tarball
          path: tarball

      # Verify the release tag against package.json INSIDE the actual artifact,
      # rather than against another checkout.
      - name: Verify release artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t TARBALLS < <(
            find tarball -maxdepth 1 -type f \
              -name 'xmoon76-dsh-pi-tui-*.tgz' \
              -print \
              | sort
          )

          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            printf '%s\n' "${TARBALLS[@]}" >&2
            exit 1
          fi

          TARBALL="${TARBALLS[0]}"

          VERSION="$(
            tar -xOf "$TARBALL" package/package.json |
              node -e "
                const fs = require('node:fs');
                const pkg = JSON.parse(fs.readFileSync(0, 'utf8'));
                process.stdout.write(pkg.version);
              "
          )"

          TAG="${GITHUB_REF_NAME}"

          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG does not match artifact version v$VERSION" >&2
            exit 1
          fi

          echo "Publishing:"
          echo "  tag:     $TAG"
          echo "  version: $VERSION"
          echo "  tarball: $TARBALL"
          echo "  sha256:  $(sha256sum "$TARBALL" | awk '{print $1}')"
          echo "  node:    $(node --version)"
          echo "  npm:     $(npm --version)"

          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish "./${{ steps.package.outputs.tarball }}" --access public

  # ---------------------------------------------------------------------------
  # Create the GitHub Release AFTER npm publish succeeded, so a visible
  # Release always means the same version is already on npm.
  #
  # The assets are the SAME artifact chain as npm: the tarball produced by
  # build-and-pack, smoke-tested by compat-smoke and published by publish —
  # never a rebuild. A SHA256 file rides along for download verification.
  #
  # The job is re-runnable: an existing release is edited in place and assets
  # are uploaded with --clobber.
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - publish
      - build-and-pack
      - release-metadata

    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Download release tarball
        uses: actions/download-artifact@v8
        with:
          name: dsh-pi-tui-tarball
          path: release-assets

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: dsh-pi-tui-release-notes
          path: release-metadata

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t TARBALLS < <(
            find release-assets -maxdepth 1 -type f \
              -name 'xmoon76-dsh-pi-tui-*.tgz' \
              -print \
              | sort
          )

          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            printf '%s\n' "${TARBALLS[@]}" >&2
            exit 1
          fi

          TARBALL="${TARBALLS[0]}"
          BASENAME="$(basename "$TARBALL")"
          CHECKSUM="${TARBALL}.sha256"

          (
            cd "$(dirname "$TARBALL")"
            sha256sum "$BASENAME" > "${BASENAME}.sha256"
          )

          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

          echo "Release assets:"
          ls -lh "$TARBALL" "$CHECKSUM"
          cat "$CHECKSUM"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.assets.outputs.tarball }}
          CHECKSUM: ${{ steps.assets.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"

          CREATE_ARGS=()

          # SemVer prerelease, e.g. 0.4.0-rc.1
          if [[ "$VERSION" == *-* ]]; then
            CREATE_ARGS+=(--prerelease)
          fi

          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            echo "Updating existing release $TAG"

            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "dsh-pi-tui $TAG" \
              --notes-file release-metadata/release-notes.md
          else
            echo "Creating release $TAG"

            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "dsh-pi-tui $TAG" \
              --notes-file release-metadata/release-notes.md \
              "${CREATE_ARGS[@]}"
          fi

          gh release upload "$TAG" \
            "$TARBALL" \
            "$CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
